<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>定制申请</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: "Microsoft Yahei", "PingFang SC", sans-serif; color: #3d2b1f; }
        .wrap { padding: 40px 6%; max-width: 700px; margin: 0 auto; position: relative; z-index: 1; }
        h2 { background: linear-gradient(135deg, #5c3317, #784b2a); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; font-size: 24px; letter-spacing: 1px; margin: 0 0 24px; }
        .box {
            background: rgba(255,255,255,0.72); backdrop-filter: blur(12px) saturate(150%); -webkit-backdrop-filter: blur(12px) saturate(150%);
            padding: 36px 32px; border-radius: 18px;
            box-shadow: 0 4px 20px rgba(92,51,23,0.08); border: 1px solid rgba(200,170,120,0.18);
        }
        .form-row { margin: 18px 0; display: flex; align-items: flex-start; gap: 14px; }
        label { display: inline-block; min-width: 110px; color: #784b2a; font-size: 14px; font-weight: 500; padding-top: 10px; text-align: right; }
        input[type=text], input[type=password], textarea, select {
            flex: 1; padding: 10px 14px; border: 1px solid rgba(200,170,120,0.3); border-radius: 10px;
            font-size: 14px; background: rgba(255,255,255,0.7); color: #3d2b1f; transition: all 0.25s; font-family: inherit;
        }
        textarea { height: 90px; resize: vertical; }
        input:focus, textarea:focus, select:focus { border-color: #a0673f; box-shadow: 0 0 0 3px rgba(120,75,42,0.1); outline: none; }
        .submit-row { margin-top: 28px; display: flex; align-items: center; gap: 16px; padding-left: 124px; }
        .submit-row button {
            display: inline-block !important; padding: 12px 32px !important;
            background: linear-gradient(135deg, #784b2a, #a0673f) !important; color: #fff !important;
            border: none !important; border-radius: 10px !important; cursor: pointer;
            font-size: 15px !important; font-weight: 600; transform: none;
            box-shadow: 0 4px 12px rgba(120,75,42,0.25) !important; transition: none; letter-spacing: 1px;
        }
        .submit-row button:hover {
            transform: none !important; display: inline-block !important; padding: 12px 32px !important;
            color: #fff !important; font-size: 15px !important; letter-spacing: 1px;
            background: linear-gradient(135deg, #784b2a, #a0673f) !important;
            box-shadow: 0 4px 12px rgba(120,75,42,0.25) !important;
        }
        .submit-row a { color: #784b2a; text-decoration: none; font-size: 14px; transition: all 0.2s; }
        .submit-row a:hover { color: #a0673f; }
        .msg { color: #0f5132; margin-bottom: 14px; font-size: 14px; }
    </style>
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>

<div class="page-hero">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="hero-inner">
        <h1>手作定制申请</h1>
        <p>向匠人发起定制需求，线上沟通实现专属手作</p>
    </div>
</div>

<div class="page-body" style="padding-top:32px;">
    <div class="box">
        <h2>发起手作定制申请</h2>
        <p class="msg" th:text="${msg}"></p>

        <form th:action="@{/custom/apply}" method="post">
            <div class="form-row">
                <label>选择匠人：</label>
                <select name="craftsmanId" required>
                    <option value="">--请选择匠人--</option>
                    <option th:each="c : ${craftsmen}"
                            th:value="${c.id}"
                            th:text="${c.username + (c.intro != null ? ' · ' + c.intro : '')}"></option>
                </select>
            </div>

            <div class="form-row">
                <label>作品描述：</label>
                <textarea name="workDesc" required placeholder="你想定制的作品内容、主题、风格..."></textarea>
            </div>

            <div class="form-row">
                <label>材质要求：</label>
                <input type="text" name="materialRequire" placeholder="如：紫檀木、苏绣丝线"/>
            </div>

            <div class="form-row">
                <label>心理预算：</label>
                <input type="text" name="budget" placeholder="如：500-1000元"/>
            </div>

            <div class="form-row">
                <label>期望完成时间：</label>
                <input type="text" name="expectFinishTime" placeholder="如：2026年12月前"/>
            </div>

            <div class="form-row">
                <label>备注留言：</label>
                <textarea name="remark" placeholder="给匠人的其他说明"></textarea>
            </div>

            <div class="submit-row">
                <button type="submit">提交申请</button>
                <a th:href="@{/custom/myApply}">查看我的申请 →</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
