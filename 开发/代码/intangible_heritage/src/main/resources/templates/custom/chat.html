<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>定制沟通</title>
    <style>
        body{margin:0;font-family:"Microsoft Yahei",sans-serif;background:#f8f5f0;}
        .wrap{padding:30px 50px;max-width:880px;}
        h2{color:#784b2a;}
        .head{background:#fff;padding:18px 24px;border-radius:8px;box-shadow:0 1px 4px #ccc;margin-bottom:16px;}
        .head h3{margin:0 0 8px 0;color:#5c3a1f;}
        .head .row{color:#555;font-size:14px;margin:4px 0;}
        .badge{padding:3px 10px;border-radius:10px;font-size:13px;}
        .s0{background:#fff3cd;color:#8a6d3b;}
        .s1{background:#f8d7da;color:#842029;}
        .s2{background:#d1e7dd;color:#0f5132;}
        .s3{background:#cfe2ff;color:#084298;}
        .s4{background:#ffe8cc;color:#a05a00;}
        .s5{background:#e2d5f8;color:#5b3a9e;}
        .s6{background:#d8ecfd;color:#0b5ed7;}
        .s7{background:#d1e7dd;color:#0f5132;}
        .quote-card{background:#fff;border-radius:8px;box-shadow:0 1px 4px #ccc;padding:14px 20px;margin:12px 0;}
        .quote-card h4{margin:0 0 8px;color:#5c3a1f;}
        .quote-card .row{color:#555;font-size:14px;margin:4px 0;}
        .quote-card input{padding:6px;border:1px solid #ccc;border-radius:4px;margin:0 10px 8px 4px;}
        .quote-card label{font-size:14px;color:#555;}
        .pay-btn{background:#0f7b4d !important;}
        .warn-btn{background:#c0392b !important;}
        .actions form{display:inline-block;margin-right:10px;}
        .chat-box{background:#fff;border-radius:8px;box-shadow:0 1px 4px #ccc;height:380px;overflow-y:auto;padding:18px;}
        .msg{margin:10px 0;padding:8px 14px;border-radius:8px;max-width:70%;word-wrap:break-word;}
        .mine{margin-left:auto;background:#d1e7dd;}
        .others{margin-right:auto;background:#f0f0f0;}
        .sender{font-size:12px;color:#888;margin-bottom:2px;}
        .time{font-size:11px;color:#aaa;text-align:right;}
        .input-row{display:flex;gap:10px;margin-top:14px;}
        input[type=text]{flex:1;padding:8px;border:1px solid #ccc;border-radius:4px;}
        button{padding:8px 24px;background:#784b2a;color:#fff;border:none;border-radius:4px;cursor:pointer;}
        button:hover{background:#5c3a1f;}
        button:disabled{background:#aaa;cursor:not-allowed;}
        .notice{color:#842029;margin-top:8px;}
        a.btn{color:#784b2a;}
    </style>
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>

<div class="wrap">
    <div class="head">
        <h3>定制沟通 · 单号 #<span th:text="${order.id}"></span></h3>
        <div class="row">对方：<span th:text="${other?.nickname}"></span></div>
        <div class="row">作品描述：<span th:text="${order.workDesc}"></span></div>
        <div class="row">状态：
            <span class="badge"
                  th:classappend="'s' + ${order.orderStatus}"
                  th:text="${order.statusText}"></span>
        </div>
    </div>

    <p class="notice" th:text="${msg}"></p>

    <!-- ===== 交易区 ===== -->
    <!-- 匠人报价入口（沟通中） -->
    <div class="quote-card" th:if="${order.orderStatus == 2 and isCraftsman}">
        <h4>提交报价</h4>
        <form th:action="@{'/custom/quote/' + ${order.id}}" method="post">
            <label>总价（元）<input type="number" name="quotePrice" step="0.01" min="0.01" required></label>
            <label>报价说明<input type="text" name="quoteNote" placeholder="工艺、工期、材料等说明（选填）"></label>
            <button type="submit" class="pay-btn">发送报价</button>
        </form>
    </div>

    <!-- 报价确认（待付定金） -->
    <div class="quote-card" th:if="${order.orderStatus == 4}">
        <h4>匠人报价</h4>
        <div class="row">总价：<b style="color:#c0392b;">¥ <span th:text="${order.quotePrice}"></span></b></div>
        <div class="row">定金：<b>¥ <span th:text="${order.depositAmount}"></span></b>，完工后支付尾款 ¥ <span th:text="${balanceAmount}"></span></div>
        <div class="row" th:if="${order.quoteNote != null and !order.quoteNote.isEmpty()}">说明：<span th:text="${order.quoteNote}"></span></div>
        <div class="actions" th:if="${!isCraftsman}">
            <form th:action="@{'/custom/payDeposit/' + ${order.id}}" method="post"
                  onsubmit="return confirm('确认进入收银台支付定金？');">
                <button type="submit" class="pay-btn">支付定金</button>
            </form>
            <form th:action="@{'/custom/quoteReject/' + ${order.id}}" method="post"
                  onsubmit="return confirm('拒绝该报价并继续沟通？');">
                <button type="submit" class="warn-btn">拒绝报价</button>
            </form>
        </div>
        <div class="row" th:if="${isCraftsman}">等待申请人确认报价…（期间可继续在下方聊天）</div>
    </div>

    <!-- 制作中 -->
    <div class="quote-card" th:if="${order.orderStatus == 5}">
        <h4>订单制作中</h4>
        <div class="row">定金已支付，匠人正在制作，可在下方聊天同步进度。</div>
        <div class="actions" th:if="${isCraftsman}">
            <form th:action="@{'/custom/done/' + ${order.id}}" method="post"
                  onsubmit="return confirm('确认已完成制作？确认后等待申请人支付尾款。');">
                <button type="submit" class="pay-btn">标记完工</button>
            </form>
        </div>
    </div>

    <!-- 待付尾款 -->
    <div class="quote-card" th:if="${order.orderStatus == 6}">
        <h4>待付尾款</h4>
        <div class="row">匠人已完工，尾款金额：<b style="color:#c0392b;">¥ <span th:text="${balanceAmount}"></span></b></div>
        <div class="actions" th:if="${!isCraftsman}">
            <form th:action="@{'/custom/payBalance/' + ${order.id}}" method="post"
                  onsubmit="return confirm('确认进入收银台支付尾款？');">
                <button type="submit" class="pay-btn">支付尾款</button>
            </form>
        </div>
        <div class="row" th:if="${isCraftsman}">等待申请人支付尾款…</div>
    </div>

    <!-- 交易完成 -->
    <div class="quote-card" th:if="${order.orderStatus == 7}">
        <h4>交易完成</h4>
        <div class="row">总价 ¥<span th:text="${order.quotePrice}"></span> 已付清（定金 ¥<span th:text="${order.depositAmount}"></span> + 尾款 ¥<span th:text="${balanceAmount}"></span>），感谢使用！</div>
    </div>

    <!-- 消息列表 -->
    <div class="chat-box" id="chatBox">
        <div th:each="m : ${messages}"
             th:classappend="${m.senderId == loginUserId ? 'msg mine' : 'msg others'}">
            <div class="sender" th:text="${m.senderId == loginUserId ? '我' : (other?.nickname != null ? other.nickname : '对方')}"></div>
            <div th:text="${m.content}"></div>
            <div class="time" th:text="${m.sendTime}"></div>
        </div>
        <div th:if="${messages == null || messages.isEmpty()}" style="color:#aaa;text-align:center;">暂无消息</div>
    </div>

    <!-- 输入区：沟通中/待付定金/制作中/待付尾款 均可发消息 -->
    <form class="input-row" th:action="@{'/custom/chat/' + ${order.id}}" method="post"
          th:if="${order.orderStatus == 2 or order.orderStatus == 4 or order.orderStatus == 5 or order.orderStatus == 6}">
        <input type="text" name="content" placeholder="输入消息..." required>
        <button type="submit">发送</button>
    </form>
    <div class="notice" th:if="${order.orderStatus != 2 and order.orderStatus != 4 and order.orderStatus != 5 and order.orderStatus != 6}">
        当前状态【<span th:text="${order.statusText}"></span>】，不可发送消息。
    </div>

    <!-- 完结按钮：仅沟通中且未报价时双方可见 -->
    <div th:if="${order.orderStatus == 2 and order.quotePrice == null}" style="margin-top:14px;">
        <form th:action="@{'/custom/finish/' + ${order.id}}" method="post"
              onsubmit="return confirm('确认完结此定制需求？完结后将无法再发消息。');">
            <button type="submit" style="background:#084298;">完结需求</button>
        </form>
    </div>

    <p style="margin-top:18px;">
        <a class="btn" th:href="@{/custom/myApply}" th:if="${session.loginUser != null && session.loginUser.role == 'USER'}">返回我的申请</a>
        <a class="btn" th:href="@{/custom/myCraft}" th:if="${session.loginUser != null && session.loginUser.role == 'CRAFTSMAN'}">返回发给我的</a>
    </p>
</div>

<!-- AJAX 轮询刷新消息列表，5秒一次 -->
<script th:inline="javascript">
    const orderId = /*[[${order.id}]]*/ 0;
    const loginUserId = /*[[${loginUserId}]]*/ 0;
    const otherName = /*[[${other?.nickname}]]*/ '对方';

    function renderMessages(list) {
        const box = document.getElementById('chatBox');
        if (!list || list.length === 0) {
            box.innerHTML = '<div style="color:#aaa;text-align:center;">暂无消息</div>';
            return;
        }
        box.innerHTML = list.map(m => {
            const mine = m.senderId === loginUserId;
            const senderName = mine ? '我' : (otherName || '对方');
            // 简易 XSS 转义
            const esc = s => (s || '').replace(/[<>&"']/g, c => ({
                '<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'
            })[c]);
            return `<div class="msg ${mine ? 'mine' : 'others'}">
                <div class="sender">${senderName}</div>
                <div>${esc(m.content)}</div>
                <div class="time">${m.sendTime || ''}</div>
            </div>`;
        }).join('');
        box.scrollTop = box.scrollHeight;
    }

    async function poll() {
        try {
            const res = await fetch(`/custom/messages/${orderId}`);
            if (res.ok) {
                const data = await res.json();
                renderMessages(data);
            }
        } catch (e) { /* 静默 */ }
    }
    setInterval(poll, 5000);
</script>
</body>
</html>
