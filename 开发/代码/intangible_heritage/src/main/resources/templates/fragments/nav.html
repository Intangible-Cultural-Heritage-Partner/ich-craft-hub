<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body th:fragment="navbar">
<style>
    .nav-bar { background: #2c3e50; color: #fff; padding: 1rem 2rem; display: flex; gap: 1.5rem; align-items: center; }
    .nav-bar a { color: #fff; text-decoration: none; }
    .nav-bar a:hover { text-decoration: underline; }
    .nav-title { font-weight: bold; margin-right: 1rem; }
    .nav-user { margin-left: auto; }
</style>
<div class="nav-bar">
    <span class="nav-title">非遗手作共创平台</span>
    <a th:href="@{/}">首页</a>
    <a th:href="@{/work/list}">非遗展品</a>
    <a th:href="@{/tutorial/list}">手作教程</a>
    <a th:href="@{/userWork/share}">用户作品</a>
    <span class="nav-user" th:if="${session.loginUser == null}">
        <a th:href="@{/login}">登录</a> · <a th:href="@{/register}">注册</a>
    </span>
    <span class="nav-user" th:if="${session.loginUser != null}">
        <a th:if="${session.loginUser.role == 'CRAFTSMAN' or session.loginUser.role == '1'}" th:href="@{/work/create}">发布展品</a>
        <a th:if="${session.loginUser.role == 'CRAFTSMAN' or session.loginUser.role == '1'}" th:href="@{/work/mine}">我的展品</a>
        <a th:href="@{/user/userCenter}">个人中心</a>
        <a th:href="@{/logout}">退出登录</a>
    </span>
</div>
</body>
</html>
