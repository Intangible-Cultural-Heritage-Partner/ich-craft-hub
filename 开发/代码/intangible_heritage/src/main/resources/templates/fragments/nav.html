<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body th:fragment="navbar">
<style>
    * { box-sizing: border-box; }
    .nav-bar{
        background: #fff;
        box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        padding: 0 30px;
        height: 60px;
        display: flex;
        align-items: center;
        gap: 30px;
        position: sticky;
        top: 0;
        z-index: 100;
    }
    .nav-logo {
        font-size: 18px;
        font-weight: 700;
        background: linear-gradient(135deg, #e6162d, #c81424);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-right: 10px;
    }
    .nav-bar a.nav-link{
        color: #555;
        text-decoration: none;
        font-size: 15px;
        padding: 6px 2px;
        transition: color 0.2s;
    }
    .nav-bar a.nav-link:hover{
        color: #e6162d;
    }

    .avatar-wrap{
        margin-left: auto;
        position: relative;
        height: 60px;
        display: flex;
        align-items: center;
        cursor: pointer;
    }
    .avatar-img{
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 2px solid #eee;
        object-fit: cover;
        display: block;
        transition: border-color 0.2s;
        background: #f0f0f0;
    }
    .avatar-wrap:hover .avatar-img {
        border-color: #e6162d;
    }

    /* 下拉菜单：从容器底部无缝开始，不要 margin-top、不要 overflow:hidden */
    .dropdown-menu{
        display: none;
        position: absolute;
        right: 0;
        top: 100%;
        background: #fff;
        min-width: 170px;
        border-radius: 0 0 10px 10px;
        box-shadow: 0 6px 20px rgba(0,0,0,0.12);
        z-index: 999;
        padding: 6px 0;
    }

    .dropdown-menu a{
        display: block;
        color: #333;
        padding: 10px 18px;
        font-size: 14px;
        text-decoration: none;
        transition: background 0.15s, color 0.15s;
    }
    .dropdown-menu a:hover{
        background: #fff5f6;
        color: #e6162d;
    }
    .avatar-wrap:hover .dropdown-menu{
        display: block;
    }
</style>

<div class="nav-bar">
    <div class="nav-logo">非遗手作共创平台</div>
    <a class="nav-link" th:href="@{/}">首页</a>
    <a class="nav-link" th:href="@{/work/list}">非遗展品</a>
    <a class="nav-link" th:href="@{/tutorial/list}">手作教程</a>

    <div class="avatar-wrap">
        <img class="avatar-img"
             th:src="${session.loginUser != null && session.loginUser.avatar != null && session.loginUser.avatar != '' ? session.loginUser.avatar : '/images/default_avatar.png'}"
             alt="头像">

        <div class="dropdown-menu">
            <div th:if="${session.loginUser == null}">
                <a th:href="@{/login}">登录</a>
                <a th:href="@{/register}">注册</a>
            </div>

            <div th:if="${session.loginUser != null && session.loginUser.role == '0'}">
                <a th:href="@{/userWork/share}">作品广场</a>
                <a th:href="@{/userWork/publish}">发布作品</a>
                <a th:href="@{/user/userCenter}">个人中心</a>
                <a th:href="@{/logout}">退出登录</a>
            </div>

            <div th:if="${session.loginUser != null && session.loginUser.role == '1'}">
                <a th:href="@{/heritageWork/publish}">发布展品</a>
                <a th:href="@{/tutorial/publish}">发布教程</a>
                <a th:href="@{/custom/myApply}">我的定制申请</a>
                <a th:href="@{/user/userCenter}">个人中心</a>
                <a th:href="@{/logout}">退出登录</a>
            </div>

            <div th:if="${session.loginUser != null && session.loginUser.role == '2'}">
                <a th:href="@{/audit/list}">内容审核</a>
                <a th:href="@{/admin/stat}">数据概览</a>
                <a th:href="@{/user/userCenter}">个人中心</a>
                <a th:href="@{/logout}">退出登录</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
