<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>登录 / 注册</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "Microsoft Yahei", "PingFang SC", sans-serif;
            background: linear-gradient(135deg, #784b2a 0%, #a0673f 50%, #c89060 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: absolute;
            width: 500px; height: 500px;
            border-radius: 50%;
            background: rgba(255,255,255,0.08);
            top: -150px; left: -150px;
        }
        body::after {
            content: '';
            position: absolute;
            width: 400px; height: 400px;
            border-radius: 50%;
            background: rgba(255,255,255,0.06);
            bottom: -120px; right: -120px;
        }
        .auth-card {
            width: 440px;
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
            overflow: hidden;
            position: relative;
            z-index: 1;
        }
        .brand-bar {
            background: linear-gradient(135deg, #784b2a, #a0673f);
            color: #fff;
            text-align: center;
            padding: 24px 20px 20px;
        }
        .brand-bar .logo { font-size: 28px; margin-bottom: 6px; }
        .brand-bar .title { font-size: 18px; font-weight: bold; letter-spacing: 2px; }
        .brand-bar .sub { font-size: 12px; opacity: 0.8; margin-top: 4px; }
        .tabs {
            display: flex;
            background: #faf7f2;
            border-bottom: 1px solid #f0e6d8;
        }
        .tab {
            flex: 1;
            padding: 16px 0;
            text-align: center;
            cursor: pointer;
            color: #999;
            font-size: 16px;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
        }
        .tab.active {
            color: #784b2a;
            font-weight: bold;
            border-bottom-color: #784b2a;
            background: #fff;
        }
        .slider {
            display: flex;
            width: 200%;
            transition: transform 0.4s ease;
        }
        .slider.to-register { transform: translateX(-50%); }
        .panel {
            width: 50%;
            padding: 28px 34px;
        }
        .panel h2 {
            margin: 0 0 20px;
            color: #784b2a;
            font-size: 22px;
        }
        .panel .field { margin-bottom: 16px; }
        .panel label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-size: 14px;
        }
        .panel input {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid #d8cbbd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .panel input:focus {
            border-color: #784b2a;
            box-shadow: 0 0 0 3px rgba(120,75,42,0.1);
        }
        .captcha-row { display: flex; gap: 10px; }
        .captcha-row input { flex: 1; }
        .captcha-img {
            height: 42px;
            cursor: pointer;
            border: 1px solid #d8cbbd;
            border-radius: 8px;
        }
        .btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #784b2a, #a0673f);
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 4px 12px rgba(120,75,42,0.3);
        }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(120,75,42,0.4); }
        .btn:active { transform: translateY(0); }
        .guest-btn {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #784b2a;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }
        .guest-btn:hover { text-decoration: underline; }
        .msg {
            color: #c0392b;
            font-size: 14px;
            margin-bottom: 12px;
            min-height: 20px;
            padding: 8px 12px;
            background: #fef0f0;
            border-radius: 6px;
            display: none;
        }
        .msg:not(:empty) { display: block; }
    </style>
</head>
<body>
<div class="auth-card">
    <div class="brand-bar">
        <div class="logo">🏺</div>
        <div class="title">非遗手作共创平台</div>
        <div class="sub">传承匠心 · 共创美好</div>
    </div>
    <div class="tabs">
        <div class="tab active" id="tab-login" onclick="switchTab('login')">登录</div>
        <div class="tab" id="tab-register" onclick="switchTab('register')">注册</div>
    </div>

    <div class="slider" id="slider">
        <div class="panel">
            <h2>用户登录</h2>
            <p class="msg" th:text="${msg}"></p>
            <form th:action="@{/login}" method="post">
                <div class="field">
                    <label>用户名 / 手机号</label>
                    <input type="text" name="account" required placeholder="请输入用户名或手机号">
                </div>
                <div class="field">
                    <label>密码</label>
                    <input type="password" name="password" required>
                </div>
                <button type="submit" class="btn">登录</button>
            </form>
            <a class="guest-btn" th:href="@{/}">游客访问</a>
        </div>

        <div class="panel">
            <h2>用户注册</h2>
            <p class="msg" th:text="${msg}"></p>
            <form th:action="@{/register}" method="post">
                <div class="field">
                    <label>用户名</label>
                    <input type="text" name="username" required>
                </div>
                <div class="field">
                    <label>密码</label>
                    <input type="password" name="password" required>
                </div>
                <div class="field">
                    <label>手机号</label>
                    <input type="tel" name="phone" required pattern="\d{11}" maxlength="11" placeholder="请输入11位手机号">
                </div>
                <div class="field">
                    <label>验证码</label>
                    <div class="captcha-row">
                        <input type="text" name="captcha" required maxlength="4" placeholder="请输入验证码">
                        <img class="captcha-img" th:src="@{/captcha}" alt="点击刷新验证码" title="点击刷新验证码" onclick="refreshCaptcha(this)">
                    </div>
                </div>
                <button type="submit" class="btn">注册</button>
            </form>
        </div>
    </div>
</div>

<script th:inline="javascript">
    function switchTab(tab) {
        var slider = document.getElementById('slider');
        var tabLogin = document.getElementById('tab-login');
        var tabRegister = document.getElementById('tab-register');
        if (tab === 'register') {
            slider.classList.add('to-register');
            tabRegister.classList.add('active');
            tabLogin.classList.remove('active');
        } else {
            slider.classList.remove('to-register');
            tabLogin.classList.add('active');
            tabRegister.classList.remove('active');
        }
    }
    function refreshCaptcha(img) {
        img.src = '@{/captcha}' + '?' + new Date().getTime();
    }
    var captchaUrl = /*[[@{/captcha}]]*/ '/captcha';
    function refreshCaptcha(img) {
        img.src = captchaUrl + '?' + new Date().getTime();
    }
    var showRegister = /*[[${showRegister}]]*/ false;
    var registerError = /*[[${registerError}]]*/ false;
    if (showRegister || registerError) {
        switchTab('register');
    }
</script>
</body>
</html>
