<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${tutorial.title} + ' - 手作教程'">手作教程详情</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: "Microsoft Yahei", "PingFang SC", sans-serif; color: #3d2b1f; }
        .wrap { max-width: 980px; margin: 36px auto; padding: 0 20px; position: relative; z-index: 1; }
        .panel { background: rgba(255,255,255,0.72); backdrop-filter: blur(12px) saturate(150%); -webkit-backdrop-filter: blur(12px) saturate(150%); padding: 36px; border-radius: 16px; box-shadow: 0 4px 20px rgba(92,51,23,0.08), 0 1px 3px rgba(0,0,0,0.04); border: 1px solid rgba(200,170,120,0.18); }
        h1 { background: linear-gradient(135deg, #5c3317, #784b2a); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin: 0 0 8px; font-size: 26px; }
        .craftsman-info { color: #8a7a6a; font-size: 14px; margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid rgba(200,170,120,0.2); display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
        .reject-notice { color: #842029; background: rgba(180,35,24,0.08); padding: 14px 16px; border-radius: 8px; margin-bottom: 16px; border-left: 4px solid rgba(220,53,69,0.5); }
        .reject-notice strong { display: block; margin-bottom: 4px; }
        .hero { width: 100%; max-height: 460px; object-fit: cover; border-radius: 12px; margin-bottom: 20px; background: #f0e8da; }
        .tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
        .tags span { background: rgba(120,75,42,0.08); color: #784b2a; padding: 4px 12px; border-radius: 16px; font-size: 13px; border: 1px solid rgba(200,170,120,0.15); }
        .section { margin-top: 28px; line-height: 1.8; white-space: pre-wrap; }
        .section h2 { color: #5c3317; font-size: 19px; margin: 0 0 12px; padding-left: 12px; border-left: 4px solid #a0673f; }
        .section div { color: #4a3a2e; font-size: 15px; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; margin-top: 16px; }
        .gallery img { width: 100%; height: 180px; object-fit: cover; border-radius: 10px; cursor: pointer; transition: transform 0.2s; }
        .gallery img:hover { transform: scale(1.03); }
        .video-wrap { margin-top: 20px; }
        .video-wrap video { width: 100%; max-height: 480px; border-radius: 12px; background: #000; }
        .links { display: flex; gap: 12px; margin-top: 32px; flex-wrap: wrap; }
        .links a { color: #784b2a; text-decoration: none; padding: 8px 18px; border: 1px solid rgba(200,170,120,0.3); border-radius: 8px; font-size: 14px; transition: all 0.2s; }
        .links a:hover { background: linear-gradient(135deg, #784b2a, #a0673f); color: #fff; }
        .fav-btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 8px 18px; border-radius: 8px; font-size: 14px;
            cursor: pointer; transition: all 0.2s; text-decoration: none;
            border: 1px solid rgba(200,170,120,0.3); color: #784b2a; background: rgba(255,255,255,0.6);
        }
        .fav-btn:hover { background: linear-gradient(135deg, #784b2a, #a0673f); color: #fff; }
        .fav-btn.favorited { background: linear-gradient(135deg, #784b2a, #a0673f); color: #fff; border-color: transparent; }
        .fav-btn.favorited:hover { background: linear-gradient(135deg, #a0673f, #784b2a); }
        .img-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 9999; justify-content: center; align-items: center; }
        .img-overlay.show { display: flex; }
        .img-overlay img { max-width: 90%; max-height: 90%; border-radius: 8px; }
        .img-overlay .close-btn { position: absolute; top: 20px; right: 28px; color: #fff; font-size: 32px; cursor: pointer; line-height: 1; }
    </style>
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>

<div class="page-hero" style="padding:40px 8% 48px;">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="hero-inner">
        <h1 th:text="${tutorial.title}">教程详情</h1>
        <p th:if="${craftsman != null}" th:text="'匠人：' + ${craftsman.username}"></p>
    </div>
</div>

<main class="page-body" style="padding-top:28px;">
    <article class="panel">
        <h1 th:text="${tutorial.title}">教程标题</h1>
        <div class="craftsman-info">
            <span th:if="${craftsman != null}" th:text="'发布匠人：' + ${craftsman.username}"></span>
            <span th:if="${tutorial.category != null}" th:text="'分类：' + ${tutorial.category}"></span>
            <span th:if="${tutorial.createTime != null}" th:text="${#temporals.format(tutorial.createTime, 'yyyy-MM-dd HH:mm')}"></span>
        </div>
        <div class="reject-notice" th:if="${tutorial.auditStatus == 2 or (tutorial.auditStatus == 0 and tutorial.auditRemark != null)}">
            <strong th:text="${tutorial.auditStatus == 2 ? '该教程被审核驳回：' : '上次驳回理由（已重新提交，等待再次审核）：'}"></strong>
            <span th:text="${tutorial.auditRemark != null ? tutorial.auditRemark : '审核未通过，请修改后重新提交'}"></span>
        </div>
        <div class="tags" th:if="${tagList != null and !tagList.isEmpty()}">
            <span th:each="tag : ${tagList}" th:text="${tag}">标签</span>
        </div>
        <img class="hero" th:if="${tutorial.coverImg != null and !tutorial.coverImg.isEmpty()}" th:src="${tutorial.coverImg}" th:alt="${tutorial.title}">
        <div class="section" th:if="${tutorial.description != null and !tutorial.description.isEmpty()}">
            <h2>教程简介</h2>
            <div th:text="${tutorial.description}">教程简介</div>
        </div>
        <div class="section" th:if="${tutorial.content != null and !tutorial.content.isEmpty()}">
            <h2>图文教程</h2>
            <div th:text="${tutorial.content}">图文教程正文</div>
        </div>
        <div class="gallery" th:if="${tutorial.contentImages != null and !tutorial.contentImages.isEmpty()}">
            <img th:each="img : ${#strings.arraySplit(tutorial.contentImages, ',')}" th:src="${img}" alt="教程配图" onclick="showImage(this.src)">
        </div>
        <div class="video-wrap" th:if="${tutorial.videoUrl != null and !tutorial.videoUrl.isEmpty()}">
            <h2 style="color:#784b2a;font-size:19px;margin:0 0 12px;padding-left:12px;border-left:4px solid #784b2a;">🎬 视频教程</h2>
            <video controls th:src="${tutorial.videoUrl}">您的浏览器不支持视频播放</video>
        </div>
        <div style="margin-top:24px;" th:if="${session.loginUser != null}">
            <form method="post" th:action="@{/favorite/toggle}" style="display:inline;">
                <input type="hidden" name="targetId" th:value="${tutorial.id}">
                <input type="hidden" name="targetType" value="tutorial">
                <input type="hidden" name="redirect" th:value="'/tutorial/' + ${tutorial.id}">
                <button type="submit" class="fav-btn" th:classappend="${isFavorited} ? 'favorited' : ''">
                    <span th:if="${isFavorited}">❤️ 已收藏</span>
                    <span th:unless="${isFavorited}">🤍 收藏</span>
                </button>
            </form>
        </div>
        <div class="links">
            <a th:href="@{/work/list}">查看非遗展品</a>
            <a th:if="${session.loginUser != null and craftsman != null and session.loginUser.id == craftsman.id}"
               th:href="@{/tutorial/{id}/edit(id=${tutorial.id})}">编辑教程</a>
            <a th:href="@{/tutorial/list}">返回教程列表</a>
        </div>
    </article>
</main>
<div class="img-overlay" id="imgOverlay" onclick="this.classList.remove('show')">
    <div class="close-btn">×</div>
    <img id="overlayImg" src="">
</div>
<script>
    function showImage(src) {
        var overlay = document.getElementById('imgOverlay');
        var img = document.getElementById('overlayImg');
        img.src = src;
        overlay.classList.add('show');
    }
</script>

</body>
</html>
