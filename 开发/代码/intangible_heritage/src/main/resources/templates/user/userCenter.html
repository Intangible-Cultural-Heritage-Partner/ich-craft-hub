<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF‑8">
    <title>个人中心</title>
    <style>
        body{margin:0;font‑family:Microsoft Yahei;background:#f8f5f0;}
        .wrap{padding:30px 50px;}
        .box{background:#fff;padding:25px;border‑radius:8px;max‑width:600px;}
    </style>
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>
<div class="wrap">
    <div class="box">
        <h2>个人中心</h2>
        <hr/>
        <div>
            <p>用户名：<span th:text="${user?.username}"></span></p>
            <p>昵称：<span th:text="${user?.nickname}"></span></p>
            <p>身份角色：
                <span th:switch="${user?.role}">
                    <span th:case="'0'">普通爱好者</span>
                    <span th:case="'1'">手作匠人</span>
                    <span th:case="'2'">平台管理员</span>
                    <span th:case="'USER'">普通爱好者</span>
                    <span th:case="'CRAFTSMAN'">手作匠人</span>
                    <span th:case="'ADMIN'">平台管理员</span>
                </span>
            </p>
        </div>
        <div style="margin‑top:25px;">
            <h4>我的功能入口</h4>
            <ul>
                <li th:if="${session.loginUser?.role == '2' or session.loginUser?.role == 'ADMIN'}">
                    <a th:href="@{/admin/craftsmanApply/list}" style="font-weight: bold; color: #c0392b;">匠人申请管理</a>
                </li>
                <li><a th:href="@{/custom/myApply}">我的定制申请</a></li>
                <li><a th:href="@{/userWork/myPublish}">我发布的手作作品</a></li>
                <li><a th:href="@{/tutorial/myCollect}">我收藏的教程</a></li>
            </ul>
        </div>
        <div style="margin‑top:20px;">
            <a th:href="@{/logout}">退出登录</a>
        </div>
    </div>
</div>
</body>
</html>
