<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>个人中心</title>
    <style>
        * { box-sizing: border-box; }
        body{margin:0;font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f7fa;}
        .container{max-width:680px;margin:0 auto;padding:24px 16px 60px;}

        .profile-header{
            background: linear-gradient(135deg, #e6162d 0%, #b8121f 100%);
            border-radius: 16px;
            padding: 32px 26px;
            display: flex;
            align-items: center;
            color: #fff;
            box-shadow: 0 8px 24px rgba(230, 22, 45, 0.28);
            position: relative;
            overflow: hidden;
        }
        .profile-header::after{
            content: "";
            position: absolute;
            right: -40px; top: -40px;
            width: 180px; height: 180px;
            background: rgba(255,255,255,0.08);
            border-radius: 50%;
        }
        .avatar{
            width: 92px; height: 92px;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.95);
            object-fit: cover;
            flex-shrink: 0;
            z-index: 1;
            background: #fff;
        }
        .profile-text{margin-left: 22px; flex: 1; z-index: 1;}
        .profile-text h2{margin: 0 0 6px; font-size: 23px; font-weight: 600;}
        .profile-text .username{font-size: 13px; opacity: 0.85; margin-bottom: 6px;}
        .profile-text .intro{font-size: 13px; opacity: 0.92; line-height: 1.5;}

        .stats{
            display: flex;
            background: #fff;
            border-radius: 16px;
            margin-top: -20px;
            position: relative;
            z-index: 2;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
            overflow: hidden;
        }
        .stats .stat{flex: 1; text-align: center; padding: 20px 0; cursor: pointer; transition: background 0.2s; text-decoration: none; color: inherit;}
        .stats .stat:hover{background: #fafafa;}
        .stats .stat:not(:last-child){border-right: 1px solid #f0f0f0;}
        .stats .num{font-size: 22px; font-weight: 700; color: #e6162d; display: block; margin-bottom: 4px;}
        .stats .label{font-size: 12px; color: #888;}

        .action-row{display: flex; gap: 12px; margin-top: 18px;}
        .btn-primary{
            flex: 1;
            background: linear-gradient(135deg, #e6162d, #c81424);
            color: #fff;
            border: none;
            padding: 15px;
            border-radius: 26px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(230,22,45,0.32);
            text-decoration: none;
            text-align: center;
            display: block;
            transition: transform 0.15s;
        }
        .btn-primary:hover{transform: translateY(-2px);}
        .btn-outline{
            flex: 1;
            background: #fff;
            color: #e6162d;
            border: 1.5px solid #e6162d;
            padding: 15px;
            border-radius: 26px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            display: block;
            transition: background 0.2s;
        }
        .btn-outline:hover{background: #fff5f6;}

        .edit-panel{
            display: none;
            background: #fff;
            border-radius: 16px;
            padding: 26px;
            margin-top: 18px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
        }
        .edit-panel.show{display: block;}
        .edit-panel h3{margin: 0 0 22px; font-size: 17px; color: #222; padding-bottom: 14px; border-bottom: 1px solid #f0f0f0;}
        .form-row{margin-bottom: 18px;}
        .form-row label{display: block; font-size: 13px; color: #666; margin-bottom: 8px; font-weight: 500;}
        .form-row input[type=text], .form-row textarea{
            width: 100%; padding: 12px 14px;
            border: 1.5px solid #e8e8e8; border-radius: 10px;
            font-size: 14px; font-family: inherit;
            background: #fafafa; transition: border-color 0.2s;
            box-sizing: border-box;
        }
        .form-row input[type=text]:focus, .form-row textarea:focus{outline: none; border-color: #e6162d; background: #fff;}
        .form-row textarea{min-height: 90px; resize: vertical;}

        .avatar-upload{display: flex; align-items: center; gap: 15px;}
        .avatar-preview{width: 64px; height: 64px; border-radius: 50%; object-fit: cover; border: 2px solid #eee;}
        .file-btn{background: #f5f5f5; color: #333; padding: 11px 20px; border-radius: 22px; font-size: 13px; cursor: pointer; transition: background 0.2s;}
        .file-btn:hover{background: #ebebeb;}
        .file-input{display: none;}

        .form-actions{display: flex; gap: 12px; margin-top: 24px;}
        .btn-save{flex: 1; background: linear-gradient(135deg, #e6162d, #c81424); color: #fff; border: none; padding: 13px; border-radius: 24px; font-size: 15px; font-weight: 600; cursor: pointer;}
        .btn-cancel{flex: 1; background: #f5f5f5; color: #666; border: none; padding: 13px; border-radius: 24px; font-size: 15px; cursor: pointer;}
        .btn-cancel:hover{background: #ebebeb;}

        .logout{display: block; text-align: center; margin-top: 32px; color: #aaa; text-decoration: none; font-size: 14px;}
        .logout:hover{color: #e6162d;}
    </style>
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>

<div class="container">

    <div class="profile-header">
        <img class="avatar"
             th:src="${user.avatar != null and user.avatar != '' ? user.avatar : '/images/default_avatar.png'}"
             alt="头像"/>
        <div class="profile-text">
            <h2 th:text="${user.nickname}">昵称</h2>
            <div class="username">@<span th:text="${user.username}"></span></div>
            <div class="intro"
                 th:text="${user.intro != null and user.intro != '' ? user.intro : '这个人很懒，什么都没有留下'}">简介</div>
        </div>
    </div>

    <div class="stats">
        <a class="stat" th:href="@{/userWork/my}">
            <span class="num" th:text="${myWorksCount != null ? myWorksCount : 0}">0</span>
            <span class="label">我的作品</span>
        </a>
        <a class="stat" th:href="@{/userWork/myLikes}">
            <span class="num" th:text="${myLikesCount != null ? myLikesCount : 0}">0</span>
            <span class="label">我的点赞</span>
        </a>
        <a class="stat" th:href="@{/userWork/myComments}">
            <span class="num" th:text="${myCommentsCount != null ? myCommentsCount : 0}">0</span>
            <span class="label">我的评论</span>
        </a>
    </div>

    <div class="action-row">
        <a class="btn-primary" th:href="@{/userWork/publish}">✏️ 发布作品</a>
        <button class="btn-outline" onclick="toggleEdit()">编辑资料</button>
    </div>

    <div class="edit-panel" id="editPanel">
        <h3>编辑个人资料</h3>
        <form th:action="@{/user/updateProfile}" method="post" enctype="multipart/form-data">
            <div class="form-row">
                <label>头像</label>
                <div class="avatar-upload">
                    <img class="avatar-preview" id="avatarPreview"
                         th:src="${user.avatar != null and user.avatar != '' ? user.avatar : '/images/default_avatar.png'}"
                         alt="头像"/>
                    <label for="avatarFile" class="file-btn">选择图片</label>
                    <input type="file" id="avatarFile" name="avatarFile" class="file-input"
                           accept="image/*" onchange="previewAvatar(event)"/>
                </div>
            </div>

            <div class="form-row">
                <label>昵称</label>
                <input type="text" name="nickname" th:value="${user.nickname}" required/>
            </div>

            <div class="form-row">
                <label>简介</label>
                <textarea name="intro" th:text="${user.intro}" placeholder="介绍一下你自己..."></textarea>
            </div>

            <div class="form-actions">
                <button type="button" class="btn-cancel" onclick="toggleEdit()">取消</button>
                <button type="submit" class="btn-save">保存</button>
            </div>
        </form>
    </div>

    <a class="logout" th:href="@{/logout}">退出登录</a>

</div>

<script>
    function toggleEdit() {
        document.getElementById('editPanel').classList.toggle('show');
    }
    function previewAvatar(event) {
        var file = event.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById('avatarPreview').src = e.target.result;
        };
        reader.readAsDataURL(file);
    }
</script>
</body>
</html>
