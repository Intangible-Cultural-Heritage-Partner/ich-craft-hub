<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>作品详情</title>
  <style>
    * { box-sizing: border-box; }
    body{margin:0;font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f7fa;}
    .wrap{padding:30px 20px;max-width:720px;margin:0 auto;}
    .card{background:#fff;border-radius:16px;padding:28px;margin-bottom:20px;box-shadow:0 2px 12px rgba(0,0,0,0.05);}
    .card h2{margin:0 0 12px;font-size:24px;color:#222;}
    .desc{color:#555;font-size:15px;line-height:1.7;margin:8px 0 16px;}
    .meta{color:#999;font-size:13px;margin-bottom:20px;}

    .media-box{
      width:100%;
      max-width:560px;
      margin:0 auto 20px;
      border-radius:12px;
      overflow:hidden;
      background:#000;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .media-box img,
    .media-box video{
      width:100%;
      height:auto;
      max-height:560px;
      object-fit:contain;
      display:block;
    }

    .like-btn{
      display:inline-flex;
      align-items:center;
      gap:8px;
      background:#fff;
      color:#333;
      border:1.5px solid #eee;
      padding:10px 22px;
      border-radius:24px;
      cursor:pointer;
      font-size:15px;
      transition:all 0.2s;
    }
    .like-btn:hover{border-color:#e6162d;color:#e6162d;transform:translateY(-2px);}
    .like-btn.liked{background:#fff5f6;color:#e6162d;border-color:#e6162d;}
    .heart{font-size:18px;transition:transform 0.2s;display:inline-block;}
    .like-btn.liked .heart{animation:heartbeat 0.6s;}
    @keyframes heartbeat{
      0%{transform:scale(1);}
      30%{transform:scale(1.6);}
      50%{transform:scale(1.2);}
      70%{transform:scale(1.5);}
      100%{transform:scale(1);}
    }

    .comment{display:flex;padding:16px 0;border-bottom:1px solid #f5f5f5;}
    .comment:last-child{border-bottom:none;}
    .comment .avatar{width:42px;height:42px;border-radius:50%;margin-right:12px;flex-shrink:0;object-fit:cover;border:2px solid #f5f5f5;}
    .comment .body{flex:1;}
    .comment .head{margin-bottom:6px;}
    .comment .head strong{color:#222;font-size:14px;font-weight:600;}
    .comment .head .meta{color:#999;font-size:12px;margin-left:8px;}
    .comment .content{margin:0 0 10px;color:#333;font-size:14px;line-height:1.6;}

    .reply-toggle{color:#999;font-size:12px;cursor:pointer;background:none;border:none;padding:0;}
    .reply-toggle:hover{color:#e6162d;}

    .reply-form{display:none;margin-top:10px;}
    .reply-form.show{display:block;}
    .reply-form textarea{width:100%;padding:10px;border:1.5px solid #eee;border-radius:10px;min-height:60px;font-family:inherit;font-size:13px;box-sizing:border-box;background:#fafafa;transition:border-color 0.2s;}
    .reply-form textarea:focus{outline:none;border-color:#e6162d;background:#fff;}
    .reply-form button{margin-top:8px;background:#e6162d;color:#fff;border:none;padding:7px 20px;border-radius:18px;font-size:13px;cursor:pointer;font-weight:600;}

    .reply-list{margin-top:12px;padding:12px 14px;background:#fafafa;border-radius:12px;}
    .reply-item{display:flex;padding:8px 0;}
    .reply-item .avatar{width:32px;height:32px;border-radius:50%;margin-right:10px;flex-shrink:0;object-fit:cover;}
    .reply-item .r-body{flex:1;}
    .reply-item .r-body strong{font-size:13px;color:#222;font-weight:600;}
    .reply-item .r-body .meta{color:#999;font-size:11px;margin-left:6px;}
    .reply-item .r-body p{margin:4px 0 0;font-size:13px;color:#333;line-height:1.5;}

    .comment-form textarea{width:100%;padding:12px;border:1.5px solid #eee;border-radius:12px;min-height:80px;font-family:inherit;font-size:14px;box-sizing:border-box;background:#fafafa;transition:border-color 0.2s;}
    .comment-form textarea:focus{outline:none;border-color:#e6162d;background:#fff;}
    .comment-form .btn-submit{margin-top:12px;background:linear-gradient(135deg,#e6162d,#c81424);color:#fff;border:none;padding:11px 30px;border-radius:22px;font-size:14px;cursor:pointer;font-weight:600;box-shadow:0 4px 12px rgba(230,22,45,0.3);}
  </style>
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>
<div class="wrap">

  <div class="card">
    <h2 th:text="${work.title}">作品标题</h2>
    <p class="desc" th:text="${work.description}">作品描述</p>
    <p class="meta">
      发布时间：<span th:text="${#temporals.format(work.createTime,'yyyy-MM-dd HH:mm')}"></span>
      ｜ 点赞：<span th:text="${likeCount}">0</span>
    </p>

    <div th:if="${work.coverImg != null and work.coverImg != ''}" class="media-box">
      <img th:src="${work.coverImg}" alt="封面"/>
    </div>

    <div th:if="${work.videoUrl != null and work.videoUrl != ''}" class="media-box">
      <video th:src="${work.videoUrl}" controls></video>
    </div>

    <div th:if="${work.imageList != null and work.imageList != ''}">
      <div th:each="img : ${#strings.arraySplit(work.imageList, ',')}" class="media-box">
        <img th:src="${img}" alt="作品图"/>
      </div>
    </div>

    <form th:action="@{/userWork/like/{id}(id=${work.id})}" method="post" style="margin-top:12px;">
      <button type="submit" class="like-btn" th:classappend="${liked} ? 'liked'">
        <span class="heart" th:text="${liked} ? '❤️' : '🤍'">🤍</span>
        <span th:text="${liked} ? '已点赞' : '点赞'">点赞</span>
      </button>
    </form>
  </div>

  <div class="card">
    <h3 style="margin:0 0 18px;font-size:18px;color:#222;">评论</h3>

    <div th:if="${comments == null || comments.isEmpty()}">
      <p style="color:#999;font-size:14px;">暂无评论，来抢沙发吧！</p>
    </div>

    <div th:each="c : ${comments}" class="comment">
      <img class="avatar"
           th:src="${commentUserMap[c.userId] != null and commentUserMap[c.userId].avatar != null and commentUserMap[c.userId].avatar != '' ? commentUserMap[c.userId].avatar : '/images/default_avatar.png'}"
           alt="头像"/>
      <div class="body">
        <div class="head">
          <strong th:text="${commentUserMap[c.userId] != null ? commentUserMap[c.userId].nickname : '已注销'}">昵称</strong>
          <span class="meta" th:text="${#temporals.format(c.createTime,'yyyy-MM-dd HH:mm')}"></span>
        </div>
        <p class="content" th:text="${c.content}">评论内容</p>

        <button class="reply-toggle" type="button"
                th:data-id="${c.id}"
                onclick="toggleReply(this)">回复</button>

        <form class="reply-form" th:id="'replyForm-'+${c.id}"
              th:action="@{/userWork/comment/reply/{pid}(pid=${c.id})}" method="post">
          <textarea name="content" required placeholder="回复..."></textarea>
          <button type="submit">提交回复</button>
        </form>

        <div th:if="${replyMap != null and replyMap[c.id] != null and !replyMap[c.id].isEmpty()}" class="reply-list">
          <div th:each="r : ${replyMap[c.id]}" class="reply-item">
            <img class="avatar"
                 th:src="${commentUserMap[r.userId] != null and commentUserMap[r.userId].avatar != null and commentUserMap[r.userId].avatar != '' ? commentUserMap[r.userId].avatar : '/images/default_avatar.png'}"
                 alt="头像"/>
            <div class="r-body">
              <strong th:text="${commentUserMap[r.userId] != null ? commentUserMap[r.userId].nickname : '已注销'}">昵称</strong>
              <span class="meta" th:text="${#temporals.format(r.createTime,'yyyy-MM-dd HH:mm')}"></span>
              <p th:text="${r.content}">回复内容</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="comment-form" style="margin-top:20px;">
      <form th:action="@{/userWork/comment/{id}(id=${work.id})}" method="post">
        <textarea name="content" required placeholder="写下你的评论..."></textarea>
        <button type="submit" class="btn-submit">发表评论</button>
      </form>
    </div>
  </div>

</div>

<script>
  function toggleReply(btn) {
    var id = 'replyForm-' + btn.getAttribute('data-id');
    var el = document.getElementById(id);
    if (el) el.classList.toggle('show');
  }
</script>
</body>
</html>
