<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>发布作品</title>
    <style>
        * { box-sizing: border-box; }
        body{margin:0;font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f7fa;}
        .wrap{padding:30px 20px;max-width:640px;margin:0 auto;}
        .card{background:#fff;border-radius:16px;padding:32px;box-shadow:0 2px 12px rgba(0,0,0,0.05);}
        .card h2{margin:0 0 24px;font-size:22px;color:#222;}
        label{display:block;margin:18px 0 8px;font-size:14px;color:#555;font-weight:500;}
        input[type=text], textarea{
            width:100%;
            padding:12px 14px;
            border:1.5px solid #eee;
            border-radius:10px;
            font-size:14px;
            font-family:inherit;
            background:#fafafa;
            transition:border-color 0.2s, background 0.2s;
            box-sizing:border-box;
        }
        input[type=text]:focus, textarea:focus{outline:none;border-color:#e6162d;background:#fff;}
        textarea{min-height:110px;resize:vertical;}
        input[type=file]{
            width:100%;
            padding:10px;
            border:1.5px dashed #ddd;
            border-radius:10px;
            font-size:13px;
            background:#fafafa;
            cursor:pointer;
            transition:border-color 0.2s;
            box-sizing:border-box;
        }
        input[type=file]:hover{border-color:#e6162d;}
        .btn{background:linear-gradient(135deg,#e6162d,#c81424);color:#fff;padding:13px;border:none;border-radius:24px;cursor:pointer;margin-top:24px;width:100%;font-size:15px;font-weight:600;box-shadow:0 4px 14px rgba(230,22,45,0.35);transition:transform 0.15s;}
        .btn:hover{transform:translateY(-2px);}
    </style>
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>
<div class="wrap">
    <div class="card">
        <h2>发布我的手作作品</h2>
        <form th:action="@{/userWork/publish}" method="post" enctype="multipart/form-data">
            <label>作品标题</label>
            <input type="text" name="title" required placeholder="给作品起个名字"/>

            <label>封面图</label>
            <input type="file" name="coverFile" accept="image/*"/>

            <label>更多图片（可多选）</label>
            <input type="file" name="imageFiles" accept="image/*" multiple/>

            <label>视频（可选，建议 100MB 以内）</label>
            <input type="file" name="videoFile" accept="video/*"/>

            <label>作品描述</label>
            <textarea name="description" placeholder="讲讲这个作品的创作过程..."></textarea>

            <button type="submit" class="btn">提交发布</button>
        </form>
    </div>
</div>
</body>
</html>
