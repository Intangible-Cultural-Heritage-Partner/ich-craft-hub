<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>用户作品分享</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: "Microsoft Yahei", "PingFang SC", sans-serif; color: #3d2b1f; }
        .wrap { max-width: 1100px; margin: 0 auto; padding: 36px 20px; position: relative; z-index: 1; }
        .page-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 28px; padding-bottom: 18px; border-bottom: 2px solid rgba(200,144,96,0.15); }
        .page-header h1 { margin: 0; background: linear-gradient(135deg, #5c3317, #784b2a); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; font-size: 26px; }
        .page-header p { margin: 4px 0 0; color: #8a7a6a; font-size: 14px; }
        .header-actions { display: flex; gap: 10px; }
        .header-actions a {
            padding: 9px 20px; border-radius: 8px; font-size: 14px;
            text-decoration: none; transition: all 0.2s;
        }
        .btn-primary { background: linear-gradient(135deg, #784b2a, #a0673f); color: #fff; box-shadow: 0 4px 12px rgba(120,75,42,0.25); font-weight: 600; }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(120,75,42,0.35); }
        .btn-outline { color: #784b2a; border: 1px solid rgba(200,170,120,0.3); background: rgba(255,255,255,0.6); }
        .btn-outline:hover { background: linear-gradient(135deg, #784b2a, #a0673f); color: #fff; }
        .msg { color: #842029; background: rgba(180,35,24,0.08); padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; border: 1px solid rgba(180,35,24,0.15); }
        .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 24px; }
        .card {
            display: block; text-decoration: none; color: inherit;
            background: rgba(255,255,255,0.72); backdrop-filter: blur(12px) saturate(150%); -webkit-backdrop-filter: blur(12px) saturate(150%);
            border-radius: 14px; overflow: hidden;
            border: 1px solid rgba(200,170,120,0.18); transition: transform 0.25s, box-shadow 0.25s;
            box-shadow: 0 4px 20px rgba(92,51,23,0.08), 0 1px 3px rgba(0,0,0,0.04);
        }
        .card:hover { transform: translateY(-4px); box-shadow: 0 12px 36px rgba(92,51,23,0.12); border-color: rgba(200,170,120,0.3); }
        .card-cover { width: 100%; height: 200px; object-fit: cover; background: #f0e8da; }
        .card-body { padding: 16px; }
        .card-body h3 { margin: 0 0 8px; color: #5c3317; font-size: 17px; }
        .card-body p { margin: 0 0 12px; color: #6b5e50; font-size: 13px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .card-stats { display: flex; gap: 16px; font-size: 13px; color: #8a7a6a; }
        .card-stats span { display: flex; align-items: center; gap: 4px; }
        .status-badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; margin-bottom: 8px; }
        .status-0 { background: rgba(180,83,9,0.12); color: #8a6d3b; }
        .status-1 { background: rgba(45,122,79,0.12); color: #0f5132; }
        .status-2 { background: rgba(180,35,24,0.12); color: #842029; }
        .card-actions { display: flex; gap: 8px; margin-top: 10px; }
        .card-actions a, .card-actions .delete-link { font-size: 13px; }
        .card-actions a { color: #784b2a; text-decoration: none; }
        .card-actions a:hover { color: #a0673f; }
        .card-actions .delete-link {
            color: #b42318; background: none; border: none; cursor: pointer; font-size: 13px; padding: 0;
        }
        .card-actions .delete-link:hover { text-decoration: underline; }
        .empty { text-align: center; padding: 60px 24px; color: #8a7a6a; }
        .empty .icon { font-size: 48px; margin-bottom: 12px; }
    </style>
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>

<div class="page-hero">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="hero-inner">
        <h1 th:text="${mine != null and mine} ? '我发布的作品' : '用户作品分享'">用户作品分享</h1>
        <p th:if="${mine == null or !mine}">上传你的练习作品，与匠人及爱好者互动交流</p>
        <p th:if="${mine != null and mine}">管理我发布的所有手作作品</p>
        <div class="hero-actions">
            <a th:if="${session.loginUser != null}" th:href="@{/userWork/publish}" class="primary">+ 发布作品</a>
            <a th:if="${mine == null or !mine}" th:href="@{/userWork/myPublish}">我的作品</a>
            <a th:if="${mine != null and mine}" th:href="@{/userWork/share}">返回全部</a>
        </div>
    </div>
</div>

<div class="page-body">
    <p class="msg" th:if="${msg != null}" th:text="${msg}"></p>
    <div class="cards" th:if="${works != null and !works.isEmpty()}">
        <a class="card" th:each="w : ${works}" th:href="@{/userWork/{id}(id=${w.id})}">
            <img class="card-cover" th:if="${w.coverImg != null}" th:src="${w.coverImg}" alt="封面">
            <div class="card-cover" th:if="${w.coverImg == null}" style="display:flex;align-items:center;justify-content:center;font-size:40px;">🎨</div>
            <div class="card-body">
                <span th:if="${mine != null and mine}" class="status-badge" th:classappend="'status-' + ${w.auditStatus}">
                    <span th:switch="${w.auditStatus}"><span th:case="0">审核中</span><span th:case="1">已通过</span><span th:case="2">已驳回</span></span>
                </span>
                <h3 th:text="${w.title}">作品标题</h3>
                <p th:text="${w.description != null ? w.description : '暂无描述'}">作品描述</p>
                <div class="card-stats">
                    <span>❤️ <span th:text="${@userWorkServiceImpl.likeCount(w.id)}">0</span></span>
                    <span>💬 <span th:text="${@userWorkServiceImpl.commentCount(w.id)}">0</span></span>
                </div>
                <div class="card-actions" th:if="${mine != null and mine and session.loginUser != null and session.loginUser.id == w.userId}">
                    <span class="delete-link" th:attr="data-id=${w.id}" onclick="deleteWork(event, this)">删除</span>
                </div>
            </div>
        </a>
    </div>
    <script>
    function deleteWork(event, el) {
        event.preventDefault();
        event.stopPropagation();
        if (!confirm('确定删除该作品？')) return;
        var form = document.createElement('form');
        form.method = 'post';
        form.action = '/userWork/' + el.dataset.id + '/delete';
        document.body.appendChild(form);
        form.submit();
    }
    </script>
    <div class="empty" th:unless="${works != null and !works.isEmpty()}">
        <div class="icon">🎨</div>
        <p>暂无分享作品，快来上传你的第一件手作吧</p>
    </div>
</div>

</body>
</html>
