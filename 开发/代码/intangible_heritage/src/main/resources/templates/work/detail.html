<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${work.title} + ' - 非遗展品'">非遗展品详情</title>
    <style>
        body { margin: 0; font-family: "Microsoft Yahei", sans-serif; background: #f8f5f0; color: #333; }
        .wrap { max-width: 980px; margin: 32px auto; padding: 0 20px; }
        .panel { background: #fff; padding: 28px; border-radius: 8px; box-shadow: 0 1px 5px #0000001a; }
        .hero { max-width: 100%; max-height: 420px; display: block; margin: 18px auto; object-fit: contain; background: #eadfce; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; margin-top: 16px; }
        .gallery img { width: 100%; height: 160px; object-fit: cover; border-radius: 6px; }
        h1, h2 { color: #784b2a; }
        .section { margin-top: 26px; line-height: 1.8; white-space: pre-wrap; }
        .links { display: flex; gap: 14px; margin-top: 28px; }
        .links a { color: #784b2a; }
    </style>
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>
<main class="wrap">
    <article class="panel">
        <h1 th:text="${work.title}">展品标题</h1>
        <p th:text="${work.craftsman != null ? '发布匠人：' + work.craftsman.nickname : ''}">发布匠人</p>
        <img class="hero" th:if="${work.coverImg != null and !work.coverImg.isBlank()}" th:src="${work.coverImg}" th:alt="${work.title}">
        <div class="section">
            <h2>作品介绍</h2>
            <div th:text="${work.description != null ? work.description : '暂无介绍'}">作品介绍</div>
        </div>
        <div class="section">
            <h2>技艺背景</h2>
            <div th:text="${work.skillBackground != null ? work.skillBackground : '暂无技艺背景介绍'}">技艺背景</div>
        </div>
        <div class="gallery" th:if="${work.imageList != null and !work.imageList.isBlank()}">
            <img th:each="image : ${#strings.arraySplit(work.imageList, ',')}" th:src="${image}" alt="展品图片">
        </div>
        <div class="links">
            <a th:href="@{/tutorial/list}">查看手作教程</a>
            <a th:href="@{/userWork/share}">查看用户作品</a>
            <a th:if="${session.loginUser != null and work.craftsman != null and session.loginUser.id == work.craftsman.id}"
               th:href="@{/work/{id}/edit(id=${work.id})}">编辑展品</a>
            <a th:href="@{/work/list}">返回展品列表</a>
        </div>
    </article>
</main>
</body>
</html>
