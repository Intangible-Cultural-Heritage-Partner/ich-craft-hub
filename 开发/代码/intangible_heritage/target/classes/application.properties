spring.application.name=intangible_heritage

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/intangible_heritage_platform?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=zbw221457
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false

# 用户上传文件根目录（FileUploadUtil 使用，对应 /uploads/** 静态映射）
file.upload-dir=uploads
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# 超限时让Tomcat吞完剩余请求体再返回413，避免浏览器显示ERR_CONNECTION_RESET
server.tomcat.max-swallow-size=-1

# ===== 定制订单支付配置 =====
# 定金比例（报价的百分比，0.3 = 30%）
custom.pay.deposit-rate=0.3
# 是否启用支付宝沙箱网关（false=内置模拟收银台，true=跳转支付宝沙箱真实流程）
custom.pay.alipay.enabled=false
custom.pay.alipay.gateway=https://openapi-sandbox.dl.alipaydev.com/gateway.do
custom.pay.alipay.app-id=
custom.pay.alipay.private-key=
custom.pay.alipay.public-key=
custom.pay.alipay.notify-url=
custom.pay.alipay.return-url=http://localhost:8080/payment/alipay/return