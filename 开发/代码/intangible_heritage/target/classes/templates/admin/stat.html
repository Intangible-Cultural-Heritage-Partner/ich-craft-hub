<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>平台数据概览</title>
    <style>
        body{margin:0;font-family:"Microsoft Yahei",sans-serif;color:#1a3a5c;}
        .wrap{padding:30px 50px;position:relative;z-index:1;}
        h2{background:linear-gradient(135deg,#1a5cb0,#2a7ae2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
        .cards{display:flex;flex-wrap:wrap;gap:18px;margin-top:20px;}
        .card{background:rgba(240,248,255,0.92);backdrop-filter:blur(16px) saturate(180%);-webkit-backdrop-filter:blur(16px) saturate(180%);padding:22px 28px;border-radius:12px;box-shadow:0 4px 20px rgba(26,92,176,0.08);border:1px solid rgba(100,149,237,0.2);min-width:180px;}
        .card .label{color:#5a7a9a;font-size:14px;}
        .card .value{background:linear-gradient(135deg,#1a5cb0,#2a7ae2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-size:32px;font-weight:bold;margin-top:8px;}
        .status-list{margin-top:24px;background:rgba(240,248,255,0.92);backdrop-filter:blur(16px) saturate(180%);-webkit-backdrop-filter:blur(16px) saturate(180%);border-radius:12px;box-shadow:0 4px 20px rgba(26,92,176,0.08);border:1px solid rgba(100,149,237,0.2);padding:22px 28px;}
        .status-list h3{color:#1a5cb0;margin-top:0;}
        .status-list .row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed rgba(100,149,237,0.15);color:#1a3a5c;}
        .status-list .row:last-child{border-bottom:none;}
    </style>
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>

<div class="wrap">
    <h2>平台数据概览</h2>

    <div class="cards">
        <div class="card">
            <div class="label">用户总数</div>
            <div class="value" th:text="${stat.userCount}">0</div>
        </div>
        <div class="card">
            <div class="label">匠人数</div>
            <div class="value" th:text="${stat.craftsmanCount}">0</div>
        </div>
        <div class="card">
            <div class="label">定制申请总数</div>
            <div class="value" th:text="${stat.orderCount}">0</div>
        </div>
        <div class="card">
            <div class="label">沟通消息总数</div>
            <div class="value" th:text="${stat.messageCount}">0</div>
        </div>
    </div>

    <div class="status-list">
        <h3>定制申请状态分布</h3>
        <div class="row" th:each="entry : ${stat.orderStatusStat}">
            <span th:text="${entry.key}"></span>
            <span th:text="${entry.value + ' 件'}"></span>
        </div>
    </div>
</div>
</body>
</html>
