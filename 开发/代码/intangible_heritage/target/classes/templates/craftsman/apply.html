<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>申请成为匠人 - 非遗手作共创平台</title>

    <!-- 如果有全局 CSS，请在这里引入 -->
    <!-- <link rel="stylesheet" th:href="@{/css/style.css}"> -->

    <style>
        * { box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            margin: 0;
            color: #3d2b1f;
        }
        .container {
            max-width: 620px;
            margin: 40px auto;
            background: rgba(255,255,255,0.72);
            backdrop-filter: blur(12px) saturate(150%); -webkit-backdrop-filter: blur(12px) saturate(150%);
            padding: 36px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(92,51,23,0.08);
            border: 1px solid rgba(200,170,120,0.18);
            position: relative;
            z-index: 1;
        }
        h2 {
            background: linear-gradient(135deg, #5c3317, #784b2a); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            margin: 0 0 8px;
            font-size: 24px;
        }
        .subtitle { color: #7a6e60; font-size: 14px; margin: 0 0 28px; padding-bottom: 18px; border-bottom: 1px solid rgba(200,170,120,0.15); }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 8px;
            color: #784b2a;
            font-size: 15px;
        }
        .form-group input[type="text"],
        .form-group textarea {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid rgba(200,170,120,0.3);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            background: rgba(255,255,255,0.7);
            color: #3d2b1f;
        }
        .form-group input:focus, .form-group textarea:focus { border-color: #a0673f; box-shadow: 0 0 0 3px rgba(120,75,42,0.1); }
        .form-group textarea { resize: vertical; height: 110px; }
        .form-group input[type="file"] { padding: 8px 0; color: #7a6e60; }
        .btn-submit {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #784b2a, #a0673f);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 4px 12px rgba(120,75,42,0.25);
            margin-top: 10px;
        }
        .btn-submit:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(120,75,42,0.35); }
        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .alert-success { background-color: rgba(45,122,79,0.1); color: #0f5132; }
        .alert-warning { background-color: rgba(180,83,9,0.1); color: #8a6d3b; }
        .alert-danger { background-color: rgba(180,35,24,0.1); color: #842029; }
    </style>
</head>
<body>

<!-- 引入导航栏，注意 fragment 名字用的是 navbar -->
<div th:replace="~{fragments/nav :: navbar}"></div>

<div class="page-hero">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="hero-inner">
        <h1>申请成为匠人</h1>
        <p>传承非遗技艺，分享你的手作故事</p>
    </div>
</div>

<div class="page-body" style="padding-top:32px;">

    <div th:if="${msg}" class="alert alert-success" th:text="${msg}"></div>

    <!-- 上次申请被驳回，显示拒绝理由 -->
    <div th:if="${rejected}" class="alert alert-danger">
        <strong>您上次的匠人申请已被驳回：</strong><br>
        <span th:text="${rejectReason != null ? rejectReason : '审核未通过，请完善资料后重新提交'}"></span>
    </div>

    <div th:if="${hasPending}" class="alert alert-warning">
        您已提交过申请，正在审核中，请勿重复提交。
    </div>

    <!-- 表单 -->
    <form th:action="@{/craftsman/apply}" method="post" enctype="multipart/form-data" th:unless="${hasPending}">

        <div class="form-group">
            <label>真实姓名：</label>
            <input type="text" name="realName" required placeholder="请输入您的真实姓名">
        </div>

        <!-- 新增：匠人简介与经历 -->
        <div class="form-group">
            <label>匠人简介与经历：</label>
            <textarea name="introduce" required placeholder="请简述您的从艺经历、传承脉络等..."></textarea>
        </div>

        <div class="form-group">
            <label>擅长技艺介绍：</label>
            <textarea name="skillIntroduction" required placeholder="请详细介绍您的擅长技艺、从事年限、获得过的荣誉等..."></textarea>
        </div>

        <div class="form-group">
            <label>佐证资料图片（可多选，如作品图、证书等）：</label>
            <input type="file" name="files" multiple accept="image/*">
        </div>

        <button type="submit" class="btn-submit">提交申请</button>
    </form>
</div>


</body>
</html>
