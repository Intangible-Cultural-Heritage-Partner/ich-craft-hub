<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>我的定制申请</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: "Microsoft Yahei", "PingFang SC", sans-serif; color: #3d2b1f; }
        .wrap { padding: 36px 6%; max-width: 1100px; margin: 0 auto; position: relative; z-index: 1; }
        .page-top { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 24px; }
        h2 { background: linear-gradient(135deg, #5c3317, #784b2a); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; font-size: 24px; letter-spacing: 1px; margin: 0; }
        .msg { color: #0f5132; margin-bottom: 14px; font-size: 14px; }
        .new-btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 10px 22px; background: linear-gradient(135deg, #784b2a, #a0673f); color: #fff;
            border: none; border-radius: 10px; text-decoration: none; font-size: 14px; font-weight: 600;
            box-shadow: 0 4px 12px rgba(120,75,42,0.25); transition: all 0.25s;
        }
        .new-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(120,75,42,0.35); color: #fff; }
        table { border-collapse: separate; border-spacing: 0; width: 100%; border-radius: 14px; overflow: hidden;
            background: rgba(255,255,255,0.72); backdrop-filter: blur(12px) saturate(150%); -webkit-backdrop-filter: blur(12px) saturate(150%);
            box-shadow: 0 4px 20px rgba(92,51,23,0.08); border: 1px solid rgba(200,170,120,0.18); }
        th { background: linear-gradient(135deg, #784b2a, #a0673f); color: #fff; padding: 14px 16px; text-align: left; font-weight: 600; letter-spacing: 0.5px; font-size: 14px; }
        td { padding: 12px 16px; border-bottom: 1px solid rgba(200,170,120,0.12); font-size: 14px; color: #3d2b1f; }
        tr:hover td { background: rgba(120,75,42,0.04); }
        .badge { padding: 4px 12px; border-radius: 12px; font-size: 13px; font-weight: 500; display: inline-block; }
        .s0 { background: rgba(180,83,9,0.12); color: #8a6d3b; }
        .s1 { background: rgba(180,35,24,0.12); color: #842029; }
        .s2 { background: rgba(45,122,79,0.12); color: #0f5132; }
        .s3 { background: rgba(42,122,226,0.12); color: #1a5cb0; }
        a.btn { color: #784b2a; text-decoration: none; font-weight: 500; transition: all 0.2s; }
        a.btn:hover { color: #a0673f; }
        .empty { color: #7a6e60; text-align: center; padding: 48px; font-size: 15px; }
    </style>
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>

<div class="page-hero">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="hero-inner">
        <h1>我的定制申请</h1>
        <p>查看我发起的所有定制申请及处理进度</p>
        <div class="hero-actions">
            <a th:href="@{/custom/apply}" class="primary">+ 发起新申请</a>
        </div>
    </div>
</div>

<div class="page-body">
    <p class="msg" th:text="${msg}"></p>

    <div th:if="${orders != null && !orders.isEmpty()}">
        <table>
            <tr>
                <th>ID</th>
                <th>匠人</th>
                <th>作品描述</th>
                <th>预算</th>
                <th>期望时间</th>
                <th>状态</th>
                <th>提交时间</th>
                <th>操作</th>
            </tr>
            <tr th:each="o : ${orders}">
                <td th:text="${o.id}"></td>
                <td th:text="${partyNames.get(o.craftsmanId)}"></td>
                <td th:text="${o.workDesc}"></td>
                <td th:text="${o.budget}"></td>
                <td th:text="${o.expectFinishTime}"></td>
                <td>
                    <span class="badge"
                          th:classappend="'s' + ${o.orderStatus}"
                          th:text="${o.statusText}"></span>
                </td>
                <td th:text="${o.createTime}"></td>
                <td>
                    <a th:href="@{'/custom/chat/' + ${o.id}}" class="btn">沟通/查看</a>
                </td>
            </tr>
        </table>
    </div>
    <p class="empty" th:if="${orders == null || orders.isEmpty()}">暂无申请记录，点击右上角发起新申请</p>
</div>

</body>
</html>
