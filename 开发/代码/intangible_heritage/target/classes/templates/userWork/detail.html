<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${work.title} + ' - 作品详情'">作品详情</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: "Microsoft Yahei", "PingFang SC", sans-serif; color: #3d2b1f; }
        .wrap { max-width: 900px; margin: 36px auto; padding: 0 20px; position: relative; z-index: 1; }
        .panel { background: rgba(255,255,255,0.72); backdrop-filter: blur(12px) saturate(150%); -webkit-backdrop-filter: blur(12px) saturate(150%); padding: 36px; border-radius: 16px; box-shadow: 0 4px 20px rgba(92,51,23,0.08); border: 1px solid rgba(200,170,120,0.18); }
        h1 { color: #5c3317; margin: 0 0 8px; font-size: 26px; }
        .meta { color: #7a6e60; font-size: 14px; margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid rgba(200,170,120,0.15); display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
        .reject-notice { color: #842029; background: rgba(180,35,24,0.1); padding: 14px 16px; border-radius: 8px; margin-bottom: 16px; border-left: 4px solid rgba(180,35,24,0.5); }
        .reject-notice strong { display: block; margin-bottom: 4px; }
        .hero { width: 100%; max-height: 460px; object-fit: cover; border-radius: 12px; margin-bottom: 20px; background: #f0e8da; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; margin-top: 16px; }
        .gallery img { width: 100%; height: 180px; object-fit: cover; border-radius: 10px; cursor: pointer; transition: transform 0.2s; }
        .gallery img:hover { transform: scale(1.03); }
        .section { margin-top: 28px; line-height: 1.8; white-space: pre-wrap; }
        .section h2 { color: #5c3317; font-size: 19px; margin: 0 0 12px; padding-left: 12px; border-left: 4px solid #a0673f; }
        .section div { color: #5a4a3a; font-size: 15px; }

        .interact-bar { display: flex; align-items: center; gap: 20px; margin-top: 24px; padding: 16px 0; border-top: 1px solid rgba(200,170,120,0.15); border-bottom: 1px solid rgba(200,170,120,0.15); }
        .like-btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 10px 22px; border-radius: 8px; font-size: 15px;
            cursor: pointer; transition: all 0.2s; border: 1px solid rgba(200,170,120,0.3);
            background: rgba(255,255,255,0.6); color: #784b2a;
        }
        .like-btn:hover { border-color: #a0673f; background: rgba(120,75,42,0.08); }
        .like-btn.liked { background: linear-gradient(135deg, #784b2a, #a0673f); color: #fff; border-color: transparent; }
        .like-btn.liked:hover { background: linear-gradient(135deg, #a0673f, #784b2a); }
        .like-count { font-size: 14px; color: #7a6e60; }
        .comment-count { font-size: 14px; color: #7a6e60; }

        .comment-section { margin-top: 28px; }
        .comment-section h2 { color: #5c3317; font-size: 19px; margin: 0 0 16px; padding-left: 12px; border-left: 4px solid #a0673f; }
        .comment-form { display: flex; gap: 10px; margin-bottom: 24px; }
        .comment-form input { flex: 1; padding: 11px 14px; border: 1px solid rgba(200,170,120,0.3); border-radius: 8px; font-size: 14px; outline: none; background: rgba(255,255,255,0.7); color: #3d2b1f; }
        .comment-form input:focus { border-color: #a0673f; }
        .comment-form button { padding: 11px 22px; background: linear-gradient(135deg, #784b2a, #a0673f); color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; }
        .comment-form button:hover { opacity: 0.9; }
        .comment-item { padding: 14px 0; border-bottom: 1px solid rgba(200,170,120,0.12); }
        .comment-item:last-child { border-bottom: none; }
        .comment-author { font-weight: 600; color: #784b2a; font-size: 14px; }
        .comment-time { color: #7a6e60; font-size: 12px; margin-left: 10px; }
        .comment-content { color: #5a4a3a; font-size: 14px; margin-top: 6px; line-height: 1.6; }
        .no-comments { color: #7a6e60; text-align: center; padding: 24px; }

        .links { display: flex; gap: 12px; margin-top: 32px; flex-wrap: wrap; }
        .links a { color: #784b2a; text-decoration: none; padding: 8px 18px; border: 1px solid rgba(200,170,120,0.3); border-radius: 8px; font-size: 14px; transition: all 0.2s; background: rgba(255,255,255,0.6); }
        .links a:hover { background: linear-gradient(135deg, #784b2a, #a0673f); color: #fff; }

        .img-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 9999; justify-content: center; align-items: center; }
        .img-overlay.show { display: flex; }
        .img-overlay img { max-width: 90%; max-height: 90%; border-radius: 8px; }
        .img-overlay .close-btn { position: absolute; top: 20px; right: 28px; color: #fff; font-size: 32px; cursor: pointer; line-height: 1; }
    </style>
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>
<main class="wrap">
    <article class="panel">
        <h1 th:text="${work.title}">作品标题</h1>
        <div class="meta">
            <span th:if="${author != null}" th:text="'作者：' + ${author.username}"></span>
            <span th:if="${work.createTime != null}" th:text="${#temporals.format(work.createTime, 'yyyy-MM-dd HH:mm')}"></span>
        </div>
        <div class="reject-notice" th:if="${work.auditStatus == 2 or (work.auditStatus == 0 and work.auditRemark != null)}">
            <strong th:text="${work.auditStatus == 2 ? '该作品被审核驳回：' : '上次驳回理由（已重新提交，等待再次审核）：'}"></strong>
            <span th:text="${work.auditRemark != null ? work.auditRemark : '审核未通过，请修改后重新提交'}"></span>
        </div>
        <img class="hero" th:if="${work.coverImg != null and !work.coverImg.isEmpty()}" th:src="${work.coverImg}" th:alt="${work.title}">
        <div class="section" th:if="${work.description != null and !work.description.isEmpty()}">
            <h2>作品介绍</h2>
            <div th:text="${work.description}">作品描述</div>
        </div>
        <div class="gallery" th:if="${work.imageList != null and !work.imageList.isEmpty()}">
            <img th:each="img : ${#strings.arraySplit(work.imageList, ',')}" th:src="${img}" alt="作品图片" onclick="showImage(this.src)">
        </div>

        <div class="interact-bar">
            <form th:if="${session.loginUser != null}" method="post" th:action="@{/userWork/{id}/like(id=${work.id})}" style="display:inline;">
                <button type="submit" class="like-btn" th:classappend="${isLiked} ? 'liked' : ''">
                    <span th:if="${isLiked}">❤️</span>
                    <span th:unless="${isLiked}">🤍</span>
                    <span th:text="${isLiked} ? '已点赞' : '点赞'">点赞</span>
                </button>
            </form>
            <span th:if="${session.loginUser == null}" class="like-btn" style="cursor:default;">🤍 点赞</span>
            <span class="like-count" th:text="'共 ' + ${likeCount} + ' 次点赞'">共 0 次点赞</span>
            <span class="comment-count" th:text="${commentCount} + ' 条评论'">0 条评论</span>
        </div>

        <div class="comment-section">
            <h2>💬 评论交流</h2>
            <form th:if="${session.loginUser != null}" class="comment-form" method="post" th:action="@{/userWork/{id}/comment(id=${work.id})}">
                <input type="text" name="content" required maxlength="500" placeholder="说点什么吧...">
                <button type="submit">发表</button>
            </form>
            <p th:if="${session.loginUser == null}" class="no-comments">登录后即可发表评论</p>
            <div th:if="${comments != null and !comments.isEmpty()}">
                <div class="comment-item" th:each="c : ${comments}">
                    <span class="comment-author" th:text="${c.userId}">用户</span>
                    <span class="comment-time" th:if="${c.createTime != null}" th:text="${#temporals.format(c.createTime, 'yyyy-MM-dd HH:mm')}"></span>
                    <div class="comment-content" th:text="${c.content}">评论内容</div>
                </div>
            </div>
            <p th:if="${comments == null or comments.isEmpty()}" class="no-comments">暂无评论，来做第一个评论的人吧</p>
        </div>

        <div class="links">
            <a th:href="@{/userWork/share}">返回作品列表</a>
        </div>
    </article>
</main>
<div class="img-overlay" id="imgOverlay" onclick="this.classList.remove('show')">
    <div class="close-btn">×</div>
    <img id="overlayImg" src="">
</div>
<script>
    function showImage(src) {
        var overlay = document.getElementById('imgOverlay');
        var img = document.getElementById('overlayImg');
        img.src = src;
        overlay.classList.add('show');
    }
</script>

</body>
</html>
