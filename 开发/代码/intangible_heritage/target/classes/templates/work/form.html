<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>展品发布</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: "Microsoft Yahei", "PingFang SC", sans-serif; color: #3d2b1f; }
        .wrap { max-width: 760px; margin: 36px auto; padding: 0 20px; position: relative; z-index: 1; }
        .panel { background: rgba(255,255,255,0.72); backdrop-filter: blur(12px) saturate(150%); -webkit-backdrop-filter: blur(12px) saturate(150%); padding: 32px; border-radius: 16px; box-shadow: 0 4px 20px rgba(92,51,23,0.08); border: 1px solid rgba(200,170,120,0.18); }
        .panel h1 { color: #5c3317; margin: 0 0 6px; font-size: 24px; }
        .panel .subtitle { color: #7a6e60; font-size: 14px; margin: 0 0 24px; padding-bottom: 18px; border-bottom: 1px solid rgba(200,170,120,0.15); }
        .panel label { display: block; margin-top: 18px; color: #784b2a; font-weight: 500; font-size: 15px; }
        .panel input, .panel textarea {
            width: 100%; box-sizing: border-box; margin-top: 8px;
            padding: 11px 14px; border: 1px solid rgba(200,170,120,0.3); border-radius: 8px;
            font-size: 14px; outline: none; transition: border-color 0.2s, box-shadow 0.2s;
            background: rgba(255,255,255,0.7); color: #3d2b1f;
        }
        .panel input:focus, .panel textarea:focus { border-color: #a0673f; box-shadow: 0 0 0 3px rgba(120,75,42,0.1); }
        .panel textarea { min-height: 120px; resize: vertical; }
        .panel button, .panel a {
            display: inline-block !important; margin-top: 24px; padding: 12px 28px !important;
            border: 0; border-radius: 8px; text-decoration: none;
            font-size: 15px !important; cursor: pointer; transition: none;
        }
        .panel button {
            color: #fff !important; background: linear-gradient(135deg, #784b2a, #a0673f) !important;
            box-shadow: 0 4px 12px rgba(120,75,42,0.25) !important; font-weight: 600; transform: none;
        }
        .panel button:hover {
            transform: none !important; display: inline-block !important; padding: 12px 28px !important;
            color: #fff !important; font-size: 15px !important;
            background: linear-gradient(135deg, #784b2a, #a0673f) !important;
            box-shadow: 0 4px 12px rgba(120,75,42,0.25) !important;
        }
        .panel a {
            color: #784b2a !important; border: 1px solid rgba(200,170,120,0.3);
            background: rgba(255,255,255,0.6) !important;
        }
        .panel a:hover {
            transform: none !important; display: inline-block !important; padding: 12px 28px !important;
            color: #784b2a !important; font-size: 15px !important;
            background: rgba(255,255,255,0.6) !important;
        }
        .message { color: #842029; background: rgba(180,35,24,0.1); padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; }
        .reject-notice { color: #842029; background: rgba(180,35,24,0.1); padding: 14px 16px; border-radius: 8px; margin-bottom: 16px; border-left: 4px solid rgba(180,35,24,0.5); }
        .reject-notice strong { display: block; margin-bottom: 4px; }
        .hint { color: #7a6e60; font-size: 13px; margin-top: 6px; }
    </style>
    <style>
        .panel select { width: 100%; padding: 12px; border: 1px solid #d8cbbd; border-radius: 8px; background: #fff; color: #333; font: inherit; }
        .panel select:focus-visible { outline: 3px solid #a0673f; outline-offset: 2px; }
    </style>
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>
<main class="wrap">
    <section class="panel">
        <h1 th:text="${work.id == null ? '发布非遗展品' : '编辑非遗展品'}">发布非遗展品</h1>
        <p class="subtitle">分享你的非遗手作作品，传承传统技艺</p>
        <p class="message" th:if="${msg != null}" th:text="${msg}"></p>
        <!-- 被驳回或重新提交审核中，显示驳回理由 -->
        <div class="reject-notice" th:if="${work != null && work.id != null && (work.auditStatus == 2 or (work.auditStatus == 0 and work.auditRemark != null))}">
            <strong th:text="${work.auditStatus == 2 ? '该展品被审核驳回：' : '上次驳回理由（已重新提交，等待再次审核）：'}"></strong>
            <span th:text="${work.auditRemark != null ? work.auditRemark : '审核未通过，请修改后重新提交'}"></span>
        </div>
        <form th:action="${formAction}" method="post" enctype="multipart/form-data">
            <label>展品标题
                <input type="text" name="title" required maxlength="100" th:value="${work.title}">
            </label>
            <label>非遗分类
                <select name="category" required>
                    <option th:each="category : ${categoryOptions}" th:value="${category}"
                            th:text="${category}" th:selected="${category == work.category}">其他</option>
                </select>
            </label>
            <label>封面图片
                <input type="file" name="coverFile" accept="image/*">
            </label>
            <label>封面图片 URL（可多选）
                <input type="url" name="coverUrl" placeholder="未上传文件时使用此地址">
            </label>
            <label>展品图片文件
                <input type="file" name="imageFiles" accept="image/*" multiple>
            </label>
            <label>展品图片 URL
                <textarea name="imageUrls" placeholder="多个地址使用逗号或换行分隔"></textarea>
            </label>
            <p class="hint">同时填写文件和 URL 时，上传文件优先保存。</p>
            <label>3D 模型文件（GLB / GLTF）
                <input type="file" name="modelFile" accept=".glb,.gltf,model/gltf-binary,model/gltf+json">
            </label>
            <label>3D 模型 URL
                <input type="text" name="modelUrl" placeholder="https://example.com/exhibit.glb 或 /models/exhibit.glb" th:value="${work.modelUrl}">
            </label>
            <p class="hint">优先使用单文件 GLB；同时填写文件和 URL 时，上传文件优先保存。GLTF 的 .bin 和纹理文件必须保持相对路径可访问。</p>
            <p class="hint" th:if="${work.modelUrl != null and !work.modelUrl.isBlank()}">当前模型地址：<span th:text="${work.modelUrl}"></span></p>
            <label th:if="${work.id != null}">
                <input type="checkbox" name="removeModel" value="true" th:checked="${removeModel == true}" style="width:auto;">
                移除当前模型关联
            </label>
            <p class="hint" th:if="${work.id != null}">留空保留原模型；勾选移除会忽略模型 URL，但不会删除文件。请勿同时上传新模型。</p>
            <label>作品介绍
                <textarea name="description" th:text="${work.description}"></textarea>
            </label>
            <label>技艺背景
                <textarea name="skillBackground" th:text="${work.skillBackground}"></textarea>
            </label>
            <p class="hint" th:if="${work.id != null}" style="color: #7a6e60;">注意：编辑保存后，展品将重新进入审核流程，审核通过前不会在公开列表展示。</p>
            <button type="submit">保存展品</button>
            <a th:href="@{/work/list}">取消</a>
        </form>
    </section>
</main>
</body>
</html>
