<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${work != null} ? '编辑非遗展品' : '发布非遗展品'">发布非遗展品</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: "Microsoft Yahei", "PingFang SC", sans-serif; color: #3d2b1f; }
        .wrap { max-width: 760px; margin: 36px auto; padding: 0 20px; position: relative; z-index: 1; }
        .panel { background: rgba(255,255,255,0.72); backdrop-filter: blur(12px) saturate(150%); -webkit-backdrop-filter: blur(12px) saturate(150%); padding: 32px; border-radius: 16px; box-shadow: 0 4px 20px rgba(92,51,23,0.08); border: 1px solid rgba(200,170,120,0.18); }
        .panel h1 { color: #5c3317; margin: 0 0 6px; font-size: 24px; }
        .panel .subtitle { color: #7a6e60; font-size: 14px; margin: 0 0 24px; padding-bottom: 18px; border-bottom: 1px solid rgba(200,170,120,0.15); }
        .panel label { display: block; margin-top: 18px; color: #784b2a; font-weight: 500; font-size: 15px; }
        .panel input, .panel textarea {
            width: 100%; box-sizing: border-box; margin-top: 8px;
            padding: 11px 14px; border: 1px solid rgba(200,170,120,0.3); border-radius: 8px;
            font-size: 14px; outline: none; transition: border-color 0.2s, box-shadow 0.2s;
            background: rgba(255,255,255,0.7); color: #3d2b1f;
        body {
            margin: 0;
            font-family: "Microsoft Yahei", sans-serif;
            background-color: #f8f5f0;
            background: rgba(255,255,255,0.7); color: #3d2b1f;
        }
        .wrap { padding: 30px 60px; max-width: 720px; }
        h2 { color:#784b2a; }
        .box { background:#fff; padding:26px 30px; border-radius:10px; }
        .field { margin-bottom:18px; }
        .field label { display:block; margin-bottom:6px; color:#444; font-weight:bold; }
        .field input[type=text], .field textarea {
            width:100%; box-sizing:border-box; padding:9px 12px;
            border:1px solid #ccc; border-radius:6px; font-size:14px;
        .panel input:focus, .panel textarea:focus { border-color: #a0673f; box-shadow: 0 0 0 3px rgba(120,75,42,0.1); }
        .panel textarea { min-height: 120px; resize: vertical; }
        .panel button, .panel a {
            display: inline-block; margin-top: 24px; padding: 12px 28px;
            border: 0; border-radius: 8px; text-decoration: none;
            font-size: 15px; cursor: pointer; transition: all 0.2s;
        }
        .panel button { color: #fff; background: linear-gradient(135deg, #784b2a, #a0673f); box-shadow: 0 4px 12px rgba(120,75,42,0.25); font-weight: 600; }
        .panel button:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(120,75,42,0.35); }
        .panel a { color: #784b2a; border: 1px solid rgba(200,170,120,0.3); background: rgba(255,255,255,0.6); }
        .panel a:hover { background: linear-gradient(135deg, #784b2a, #a0673f); color: #fff; }
        .message { color: #842029; background: rgba(180,35,24,0.1); padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; }
        .reject-notice { color: #842029; background: rgba(180,35,24,0.1); padding: 14px 16px; border-radius: 8px; margin-bottom: 16px; border-left: 4px solid rgba(180,35,24,0.5); }
        .reject-notice strong { display: block; margin-bottom: 4px; }
        .hint { color: #7a6e60; font-size: 13px; margin-top: 6px; }
        .field textarea { min-height:90px; resize:vertical; }
        .hint { color:#999; font-size:12px; margin-top:4px; }
        .cur { color:#666; font-size:12px; margin-top:4px; }
        .msg { color:#c0392b; margin-bottom:14px; }
        button {
            background:#784b2a; color:#fff; border:none; padding:11px 26px;
            border-radius:6px; font-size:15px; cursor:pointer;
        }
        button:hover { background:#5d3a20; }
    </style>
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>

<div class="wrap">
    <h2 th:text="${work != null} ? '编辑非遗展品' : '发布非遗展品'">发布非遗展品</h2>
    <div class="box">
        <p class="msg" th:if="${msg}" th:text="${msg}"></p>

        <!-- 发布走 /heritageWork/publish，编辑走 /heritageWork/edit/{id}；两者共用本表单 -->
        <form th:action="${work != null} ? @{'/heritageWork/edit/' + ${work.id}} : @{/heritageWork/publish}"
              method="post" enctype="multipart/form-data">

            <div class="field">
                <label>作品标题 *</label>
                <input type="text" name="title" required th:value="${work != null} ? ${work.title} : ''">
            </div>

            <div class="field">
                <label>非遗分类 *</label>
                <input type="text" name="category" required placeholder="如：剪纸、木雕、苏绣"
                       th:value="${work != null} ? ${work.category} : ''">
            </div>

            <div class="field">
                <label>封面图</label>
                <input type="file" name="coverImgFile" accept="image/*">
                <div class="hint">jpg / png / webp / gif</div>
                <div class="cur" th:if="${work != null and work.coverImg != null}">
                    当前封面已存在，不选则保留原图
                </div>
            </div>

            <div class="field">
                <label>作品图片（可多选）</label>
<main class="wrap">
    <section class="panel">
        <h1 th:text="${work.id == null ? '发布非遗展品' : '编辑非遗展品'}">发布非遗展品</h1>
        <p class="subtitle">分享你的非遗手作作品，传承传统技艺</p>
        <p class="message" th:if="${msg != null}" th:text="${msg}"></p>
        <!-- 被驳回或重新提交审核中，显示驳回理由 -->
        <div class="reject-notice" th:if="${work != null && work.id != null && (work.auditStatus == 2 or (work.auditStatus == 0 and work.auditRemark != null))}">
            <strong th:text="${work.auditStatus == 2 ? '该展品被审核驳回：' : '上次驳回理由（已重新提交，等待再次审核）：'}"></strong>
            <span th:text="${work.auditRemark != null ? work.auditRemark : '审核未通过，请修改后重新提交'}"></span>
        </div>
        <form th:action="${formAction}" method="post" enctype="multipart/form-data">
            <label>展品标题
                <input type="text" name="title" required maxlength="100" th:value="${work.title}">
            </label>
            <label>封面图片
                <input type="file" name="coverFile" accept="image/*">
            </label>
            <label>展品图片（可多选）
                <input type="file" name="imageFiles" accept="image/*" multiple>
                <div class="hint">可一次选择多张，无3D模型时用于图片画廊</div>
                <div class="cur" th:if="${work != null and work.imageList != null}">
                    已有作品图，重新上传将覆盖
                </div>
            </div>

            <div class="field">
                <label>3D模型文件</label>
                <input type="file" name="modelFile" accept=".glb,.gltf">
                <div class="hint">.glb / .gltf，上传后详情页可旋转查看（可选）</div>
                <div class="cur" th:if="${work != null and work.modelUrl != null}">
                    已有3D模型，不选则保留
                </div>
            </div>

            <div class="field">
                <label>技艺背景</label>
                <textarea name="skillBackground" th:text="${work != null} ? ${work.skillBackground} : ''"></textarea>
            </div>

            <div class="field">
                <label>作品描述</label>
                <textarea name="description" th:text="${work != null} ? ${work.description} : ''"></textarea>
            </div>

            <button type="submit" th:text="${work != null} ? '保存修改' : '提交发布'">提交发布</button>
        </form>
    </div>
</div>
</body>
</html>
