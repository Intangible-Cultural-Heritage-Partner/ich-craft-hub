<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>非遗作品展示</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: "Microsoft Yahei", "PingFang SC", sans-serif; color: #3d2b1f; }
        .wrap { padding: 40px 6%; max-width: 1200px; margin: 0 auto; position: relative; z-index: 1; }
        .top { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 32px; flex-wrap: wrap; }
        .top h1 { margin: 0 0 6px; font-size: 28px; letter-spacing: 2px;
            background: linear-gradient(135deg, #5c3317, #784b2a); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .top p { margin: 0; color: #8a7a6a; font-size: 14px; }
        .top .actions { display: flex; gap: 10px; }
        .top a {
            color: #fff; background: linear-gradient(135deg, #784b2a, #a0673f);
            padding: 10px 22px; border-radius: 10px; text-decoration: none; font-size: 14px; font-weight: 600;
            transition: all 0.25s; display: inline-block; box-shadow: 0 4px 12px rgba(120,75,42,0.25);
        }
        .top a:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(120,75,42,0.35); }
        .message { padding: 12px 16px; background: rgba(180,83,9,0.1); color: #8a6d3b; border-radius: 10px; margin-bottom: 20px; border: 1px solid rgba(200,170,120,0.2); }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 24px; }
        .card {
            background: rgba(255,255,255,0.72); backdrop-filter: blur(12px) saturate(150%); -webkit-backdrop-filter: blur(12px) saturate(150%);
            border-radius: 16px; overflow: hidden;
            box-shadow: 0 4px 20px rgba(92,51,23,0.08), 0 1px 3px rgba(0,0,0,0.04); border: 1px solid rgba(200,170,120,0.18);
            transition: all 0.35s cubic-bezier(0.16,1,0.3,1); display: flex; flex-direction: column;
        }
        .card:hover { transform: translateY(-6px); box-shadow: 0 12px 36px rgba(92,51,23,0.12), 0 2px 6px rgba(0,0,0,0.06); border-color: rgba(200,170,120,0.3); }
        .cover { width: 100%; height: 190px; object-fit: cover; background: #f0e8da; }
        .placeholder { height: 190px; display: grid; place-items: center; color: #b8a898; background: linear-gradient(135deg, #f5efe5, #ece2d2); font-size: 14px; }
        .content { padding: 20px; flex: 1; display: flex; flex-direction: column; }
        .content h3 { margin: 0 0 8px; color: #5c3317; font-size: 17px; font-weight: 600; }
        .content small { color: #8a7a6a; font-size: 12px; display: block; margin-bottom: 8px; }
        .content p { color: #6b5e50; font-size: 14px; line-height: 1.5; margin: 0 0 14px; flex: 1; }
        .content .actions { display: flex; gap: 14px; align-items: center; }
        .content .actions a { color: #784b2a; text-decoration: none; font-size: 14px; font-weight: 500; transition: all 0.2s; }
        .content .actions a:hover { color: #a0673f; }
        .status-badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 12px; margin-bottom: 8px; align-self: flex-start; font-weight: 500; }
        .content .reject-reason { color: #842029; background: rgba(180,35,24,0.08); padding: 8px 10px; border-radius: 8px; font-size: 13px; margin: 0 0 10px; }
        .status-0 { background: rgba(180,83,9,0.12); color: #8a6d3b; }
        .status-1 { background: rgba(45,122,79,0.12); color: #0f5132; }
        .status-2 { background: rgba(180,35,24,0.12); color: #842029; }
        .empty-card { background: rgba(255,255,255,0.5); backdrop-filter: blur(12px); padding: 60px 24px; border-radius: 16px; text-align: center; color: #8a7a6a; margin-top: 24px; border: 1px dashed rgba(200,170,120,0.3); }
        .empty-card .icon { font-size: 48px; margin-bottom: 12px; }
    </style>
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>

<div class="page-hero">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="hero-inner">
        <h1 th:text="${mine == true ? '我的非遗展品' : '非遗展品'}">非遗展品</h1>
        <p>浏览匠人发布的非遗作品，了解作品背后的传统技艺</p>
        <div class="hero-actions" th:if="${session.loginUser != null and (session.loginUser.role == 'CRAFTSMAN' or session.loginUser.role == '1')}">
            <a th:href="@{/work/create}" class="primary">发布展品</a>
            <a th:href="@{/work/mine}">我的展品</a>
        </div>
    </div>
</div>

<main class="page-body">
    <p class="message" th:if="${msg != null}" th:text="${msg}"></p>
    <div class="grid" th:if="${works != null and !works.isEmpty()}">
        <article class="card" th:each="work : ${works}">
            <img class="cover" th:if="${work.coverImg != null and !work.coverImg.isBlank()}" th:src="${work.coverImg}" th:alt="${work.title}">
            <div class="placeholder" th:unless="${work.coverImg != null and !work.coverImg.isBlank()}">暂无封面</div>
            <div class="content">
                <span class="status-badge" th:if="${mine}" th:classappend="'status-' + ${work.auditStatus}">
                    <span th:switch="${work.auditStatus}">
                        <span th:case="0">审核中</span>
                        <span th:case="1">已通过</span>
                        <span th:case="2">已驳回</span>
                    </span>
                </span>
                <p class="reject-reason" th:if="${mine == true and work.auditStatus == 2 and work.auditRemark != null}"
                   th:text="'驳回理由：' + ${work.auditRemark}"></p>
                <h3 th:text="${work.title}">展品标题</h3>
                <small th:text="${work.craftsman != null ? '匠人：' + work.craftsman.username : '匠人作品'}">匠人作品</small>
                <p th:text="${work.description != null ? work.description : '暂无作品介绍'}">作品介绍</p>
                <div class="actions">
                    <a th:href="@{/work/{id}(id=${work.id})}">查看详情</a>
                    <a th:if="${session.loginUser != null and work.craftsman != null and session.loginUser.id == work.craftsman.id}"
                       th:href="@{/work/{id}/edit(id=${work.id})}">编辑</a>
                </div>
            </div>
        </article>
    </div>
    <div class="empty-card" th:unless="${works != null and !works.isEmpty()}">
        暂无展品，匠人可以从“发布展品”开始添加。
    </div>
</main>

</body>
</html>
