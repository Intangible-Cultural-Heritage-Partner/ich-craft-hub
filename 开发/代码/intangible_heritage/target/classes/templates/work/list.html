<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>非遗作品展示</title>
    <style>
        body {
            margin: 0;
            font-family: "Microsoft Yahei", sans-serif;
            background-color: #f8f5f0;
        }
        .main-container { padding: 40px 60px; }
        h1 { color:#784b2a; }
        .work-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 24px;
            margin-top: 24px;
        }
        .work-card {
            background:#fff;
            border-radius:8px;
            overflow:hidden;
            box-shadow: 0 1px 6px #0000001a;
            text-decoration:none;
            color:inherit;
            display:block;
            transition: transform .15s, box-shadow .15s;
        }
        .work-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 16px #0000002a;
        }
        .work-cover {
            width:100%;
            height:180px;
            object-fit:cover;
            background:#eee;
            display:block;
        }
        .work-cover.placeholder {
            display:flex;
            align-items:center;
            justify-content:center;
            color:#999;
            font-size:14px;
        }
        .work-body { padding:14px 16px; }
        .work-title { font-size:17px; font-weight:bold; color:#333; margin:0 0 8px; }
        .work-cat {
            display:inline-block;
            font-size:12px;
            color:#784b2a;
            background:#f3ece3;
            padding:2px 10px;
            border-radius:12px;
        }
        .empty { color:#888; margin-top:30px; }
    </style>
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>

<div class="main-container">
    <h1>非遗作品展示</h1>
    <p style="color:#666;">浏览匠人发布的非遗手作，点击查看技艺背景与作品详情</p>

    <div class="work-grid">
        <a class="work-card" th:each="w : ${works}" th:href="@{'/work/' + ${w.id}}">
            <img class="work-cover" th:if="${w.coverImg != null}" th:src="${w.coverImg}" alt="封面">
            <div class="work-cover placeholder" th:if="${w.coverImg == null}">暂无封面图</div>
            <div class="work-body">
                <p class="work-title" th:text="${w.title}">作品标题</p>
                <span class="work-cat" th:text="${w.category}">分类</span>
            </div>
        </a>
    </div>

    <p class="empty" th:if="${#lists.isEmpty(works)}">暂无已发布的非遗展品。</p>
</div>
</body>
</html>
