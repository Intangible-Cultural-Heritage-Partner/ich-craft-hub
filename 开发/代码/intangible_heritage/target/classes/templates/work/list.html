<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>非遗展品</title>
    <style>
        body { margin: 0; font-family: "Microsoft Yahei", sans-serif; background: #f8f5f0; color: #333; }
        .wrap { padding: 32px 6%; }
        .top { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
        .top a, .button { color: #fff; background: #784b2a; padding: 9px 14px; border-radius: 4px; text-decoration: none; }
        .message { padding: 10px 14px; background: #fff3cd; color: #856404; border-radius: 4px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 24px; }
        .card { background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 5px #0000001a; }
        .cover { width: 100%; height: 170px; object-fit: cover; background: #eadfce; }
        .placeholder { height: 170px; display: grid; place-items: center; color: #856f5b; }
        .content { padding: 16px; }
        .content h3 { margin: 0 0 8px; color: #784b2a; }
        .content p { min-height: 42px; color: #666; }
        .actions { display: flex; gap: 10px; align-items: center; }
        .actions a { color: #784b2a; }
    </style>
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>
<main class="wrap">
    <div class="top">
        <div>
            <h1 th:text="${mine == true ? '我的非遗展品' : '非遗展品'}">非遗展品</h1>
            <p>浏览匠人发布的非遗作品，了解作品背后的传统技艺。</p>
        </div>
        <div class="actions" th:if="${session.loginUser != null and (session.loginUser.role == 'CRAFTSMAN' or session.loginUser.role == '1')}">
            <a th:href="@{/work/create}">发布展品</a>
            <a th:href="@{/work/mine}">我的展品</a>
        </div>
    </div>
    <p class="message" th:if="${msg != null}" th:text="${msg}"></p>
    <div class="grid" th:if="${works != null and !works.isEmpty()}">
        <article class="card" th:each="work : ${works}">
            <img class="cover" th:if="${work.coverImg != null and !work.coverImg.isBlank()}" th:src="${work.coverImg}" th:alt="${work.title}">
            <div class="placeholder" th:unless="${work.coverImg != null and !work.coverImg.isBlank()}">暂无封面</div>
            <div class="content">
                <h3 th:text="${work.title}">展品标题</h3>
                <small th:text="${work.craftsman != null ? '匠人：' + work.craftsman.nickname : '匠人作品'}">匠人作品</small>
                <p th:text="${work.description != null ? work.description : '暂无作品介绍'}">作品介绍</p>
                <div class="actions">
                    <a th:href="@{/work/{id}(id=${work.id})}">查看详情</a>
                    <a th:if="${session.loginUser != null and work.craftsman != null and session.loginUser.id == work.craftsman.id}"
                       th:href="@{/work/{id}/edit(id=${work.id})}">编辑</a>
                </div>
            </div>
        </article>
    </div>
    <div class="card" style="padding: 24px; margin-top: 24px;" th:unless="${works != null and !works.isEmpty()}">
        暂无展品，匠人可以从“发布展品”开始添加。
    </div>
</main>
</body>
</html>
